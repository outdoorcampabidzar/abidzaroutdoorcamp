<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Anggota — AbidzarOutdoorcamp</title>
<meta name="description" content="HTML Data Anggota AbidzarOutdoorcamp">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#081018}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,#1c3140 0,#081018 42%,#05090d 100%);padding:22px}.wrap{width:min(980px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.04em}.muted{color:#aab7c2}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:800}.card-shell{background:rgba(9,17,24,.78);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:18px;box-shadow:0 25px 90px rgba(0,0,0,.35)}.member-card{width:min(860px,100%);margin:auto;aspect-ratio:1.586/1;position:relative;overflow:hidden;border-radius:24px;background:#17222c url('https://images.unsplash.com/photo-1788877667927-671cc0d34091?auto=format&fit=crop&fm=jpg&q=90&w=2400') center/cover no-repeat;border:1px solid rgba(255,255,255,.28);box-shadow:0 28px 80px rgba(0,0,0,.42);color:#fff}.member-card:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(5,13,20,.9),rgba(5,13,20,.48),rgba(5,13,20,.18))}.inner{position:absolute;inset:0;padding:34px;display:grid;grid-template-columns:180px 1fr 180px;gap:24px;align-items:center}.photo{width:164px;height:202px;border-radius:17px;object-fit:cover;border:3px solid rgba(255,255,255,.9);background:rgba(255,255,255,.1);box-shadow:0 12px 28px rgba(0,0,0,.35)}.photo-empty{display:grid;place-items:center;font-size:64px;font-weight:900}.eyebrow{font-size:12px;letter-spacing:.2em;font-weight:900;opacity:.8}.name{font-size:40px;line-height:1.04;font-weight:950;margin:9px 0}.role{font-weight:750;font-size:16px}.meta{display:grid;gap:8px;margin-top:18px}.meta-row{display:flex;gap:12px}.meta-row small{min-width:88px;opacity:.62}.meta-row b{font-size:14px}.codes{display:grid;gap:13px;justify-items:center}.qr{width:136px;height:136px;background:#fff;border-radius:12px;padding:9px;display:grid;place-items:center}.barcode{width:170px;background:#fff;border-radius:10px;padding:8px}.barcode svg{width:100%;height:52px}.scan-label{font-size:10px;font-weight:900;letter-spacing:.12em;opacity:.75;text-align:center}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:18px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer;background:#fff;color:#0a1117;text-decoration:none}.btn.secondary{background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.14)}.btn.primary{background:#63e6a8;color:#06120d}.btn:disabled{opacity:.55;cursor:wait}.notice{margin-top:16px;padding:13px;border-radius:14px;background:rgba(255,255,255,.06);color:#c6d0d8}.admin-only{display:none}.is-admin .admin-only{display:flex}.editor{display:none;margin-top:18px;border-top:1px solid rgba(255,255,255,.1);padding-top:18px}.is-admin .editor{display:block}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field span{font-size:13px;font-weight:700}.input{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:#0b1219;color:#fff;padding:11px 12px}.loading{text-align:center;padding:70px 10px}.error{color:#ffb5b5}@media(max-width:760px){body{padding:12px}.inner{grid-template-columns:100px 1fr 105px;padding:18px;gap:12px}.photo{width:92px;height:118px}.name{font-size:23px}.role{font-size:12px}.meta{margin-top:9px;gap:5px}.meta-row{gap:5px}.meta-row small{min-width:55px;font-size:10px}.meta-row b{font-size:11px}.qr{width:92px;height:92px}.barcode{width:105px}.barcode svg{height:40px}.eyebrow{font-size:8px}.card-shell{padding:10px;border-radius:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="brand">ABIDZAROUTDOORCAMP</div><div class="muted">Data Anggota</div></div><span id="adminBadge" class="pill">MEMBER HTML</span></div>
  <main class="card-shell"><div id="app" class="loading">Memuat data anggota...</div></main>
</div>
<script>
const SUPABASE_URL="https://radrtmyrckylvvmdhgqs.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_ad-kaXlIwFlCmV3cR3yDpA_Iq2oWMKk";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const MOUNTAIN="https://images.unsplash.com/photo-1788877667927-671cc0d34091?auto=format&fit=crop&fm=jpg&q=90&w=2400";
let member=null,isAdmin=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function memberUrl(code){const u=new URL(location.href);u.search=new URLSearchParams({member:code}).toString();return u.href}
function cardHtml(c){const photo=c.photo_url?`<img class="photo" crossorigin="anonymous" src="${esc(c.photo_url)}" alt="Foto ${esc(c.full_name)}">`:`<div class="photo photo-empty">${esc((c.full_name||"A").slice(0,1).toUpperCase())}</div>`;return `<div class="member-card" id="memberCard" style="background-image:url('${MOUNTAIN}')"><div class="inner"><div>${photo}</div><div><div class="eyebrow">ID CARD ANGGOTA · ABIDZAROUTDOORCAMP</div><div class="name">${esc(c.full_name)}</div><div class="role">${esc(c.position||"Anggota")}${c.department?` · ${esc(c.department)}`:""}</div><div class="meta"><div class="meta-row"><small>ID Anggota</small><b>${esc(c.member_code)}</b></div><div class="meta-row"><small>Status</small><b>${c.status==='active'?'AKTIF':esc(String(c.status||'').toUpperCase())}</b></div><div class="meta-row"><small>Bergabung</small><b>${c.join_date?new Date(c.join_date+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}):'-'}</b></div></div></div><div class="codes"><div class="qr" id="memberQr"></div><div class="barcode"><svg id="memberBarcode"></svg></div><div class="scan-label">SCAN ID ANGGOTA</div></div></div></div>`}
async function load(){const code=new URLSearchParams(location.search).get('member');if(!code){return showError('ID anggota tidak ditemukan.');}const {data,error}=await supabase.rpc('get_public_member_id_card',{p_member_code:code});if(error||!data?.[0])return showError('Data anggota tidak ditemukan atau tidak aktif.');member=data[0];const {data:auth}=await supabase.auth.getUser();if(auth?.user){const {data:a}=await supabase.rpc('is_admin');isAdmin=a===true}document.body.classList.toggle('is-admin',isAdmin);document.getElementById('adminBadge').textContent=isAdmin?'ADMIN · DATA ANGGOTA':'MEMBER HTML';render();}
function render(){document.getElementById('app').innerHTML=cardHtml(member)+`<div class="actions admin-only"><button class="btn primary" id="download">⬇ Download ID Card PNG · SUPER HD</button><button class="btn secondary" id="edit">✏️ Ubah Data Anggota</button></div><div class="notice">Barcode digunakan untuk identifikasi ID anggota. QR Code mengarah langsung ke halaman HTML anggota ini sehingga dapat dibuka melalui Google Scan/Google Lens.</div><section class="editor"><h3>Ubah Data Anggota</h3><form id="editForm" class="form"><label class="field"><span>Nama</span><input class="input" name="full_name" value="${esc(member.full_name)}" required></label><label class="field"><span>Jabatan / Posisi</span><input class="input" name="position" value="${esc(member.position||'')}"></label><label class="field"><span>Departemen</span><input class="input" name="department" value="${esc(member.department||'')}"></label><label class="field"><span>Tanggal Bergabung</span><input class="input" name="join_date" type="date" value="${esc(member.join_date||'')}"></label><label class="field"><span>Status</span><select class="input" name="status"><option value="active" ${member.status==='active'?'selected':''}>Aktif</option><option value="inactive" ${member.status==='inactive'?'selected':''}>Nonaktif</option><option value="suspended" ${member.status==='suspended'?'selected':''}>Ditangguhkan</option></select></label><label class="field"><span>Upload Foto Member</span><input class="input" name="photo" type="file" accept="image/*"></label><button class="btn primary" type="submit">💾 Simpan Perubahan</button></form></section>`;if(window.QRCode)new QRCode(document.getElementById('memberQr'),{text:memberUrl(member.member_code),width:112,height:112,colorDark:'#0b1120',colorLight:'#fff'});if(window.JsBarcode)JsBarcode('#memberBarcode',member.member_code,{format:'CODE128',displayValue:true,fontSize:12,height:48,margin:0});if(isAdmin){document.getElementById('edit').onclick=()=>document.querySelector('.editor').scrollIntoView({behavior:'smooth'});document.getElementById('download').onclick=downloadPng;document.getElementById('editForm').onsubmit=save}}
function showError(t){document.getElementById('app').innerHTML=`<div class="loading error"><h2>${esc(t)}</h2><p class="muted">Periksa kembali QR/Barcode ID anggota.</p></div>`}
async function save(e){e.preventDefault();if(!isAdmin)return;const f=e.currentTarget,btn=f.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Menyimpan...';try{let photoUrl=member.photo_url||null;const file=f.photo.files?.[0];if(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`${member.user_id||member.id}/${crypto.randomUUID()}.${ext}`;const up=await supabase.storage.from('member-photos').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(up.error)throw up.error;photoUrl=supabase.storage.from('member-photos').getPublicUrl(path).data.publicUrl}const payload={user_id:member.user_id,full_name:f.full_name.value.trim(),position:f.position.value.trim(),department:f.department.value.trim(),join_date:f.join_date.value||null,status:f.status.value,photo_url:photoUrl};const {data,error}=await supabase.rpc('secure_admin_upsert_member_id_card',{p_id:member.id,p_payload:payload});if(error)throw error;member=data;render();window.scrollTo({top:0,behavior:'smooth'})}catch(err){alert(err?.message||'Gagal menyimpan data.')}finally{btn.disabled=false;btn.textContent='💾 Simpan Perubahan'}}
async function downloadPng(){const el=document.getElementById('memberCard');const old=document.getElementById('download').textContent;document.getElementById('download').disabled=true;document.getElementById('download').textContent='⏳ Membuat PNG SUPER HD...';try{await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const w=1200,h=Math.round(w/1.586);const canvas=await html2canvas(el,{scale:3,useCORS:true,allowTaint:false,backgroundColor:null,logging:false,width:w,height:h});canvas.toBlob(blob=>{if(!blob)return;const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`ID-Card-${member.full_name.replace(/[^a-z0-9]+/gi,'-')}-${member.member_code}-SUPER-HD.png`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)},'image/png')}catch(err){alert('PNG gagal dibuat. Pastikan foto member dapat dimuat.')}finally{document.getElementById('download').disabled=false;document.getElementById('download').textContent=old}}
load();
</script>
</body></html>
