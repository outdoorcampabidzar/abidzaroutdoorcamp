    <main id="root" class="container detail">Memuat...</main>
    <script type="module">
      import { supabase, rupiah, esc, addCart, message } from "./app.js";

      const slug = new URLSearchParams(location.search).get("slug");
      const root = document.getElementById("root");
      let item = null;

      function availableQuantity() {
        const variant = selectedVariant();
        return Math.max(
          0,
          Number(item.type === "trip" ? item.quota : variant ? variant.stock : item.stock) || 0,
        );
      }

      function selectedVariant() {
        const id = document.getElementById("variantSelect")?.value;
        const variants = (item?.item_variants || []).filter(
          (entry) => entry.is_active !== false,
        );
        return (
          variants.find((entry) => entry.id === id) ||
          variants.find((entry) => Number(entry.stock) > 0) ||
          variants[0] ||
          null
        );
      }

      function unitPrice() {
        const variantId = selectedVariant()?.id || null;
        const tier = (item?.item_price_tiers || []).find(
          (entry) => Number(entry.duration_days) === 1 &&
            (entry.variant_id === variantId || !entry.variant_id),
        );
        return Number(tier?.price ?? item.price);
      }

      function selectedPriceTiers() {
        const variantId = selectedVariant()?.id || null;
        const tiers = item?.item_price_tiers || [];
        const specific = tiers.filter((entry) => entry.variant_id === variantId);
        return (specific.length ? specific : tiers.filter((entry) => !entry.variant_id))
          .sort((a, b) => a.duration_days - b.duration_days);
      }

      function renderPriceTiers() {
        const box = document.getElementById("variantPriceTiers");
        if (!box) return;
        const tiers = selectedPriceTiers();
        box.innerHTML = tiers.length
          ? tiers.map((tier) => `<div><span>${esc(tier.label)} · ${tier.duration_days} hari</span><strong>${rupiah(tier.price)}</strong></div>`).join("")
          : '<p class="muted">Harga paket belum diatur.</p>';
      }

      function updateVariantInterface() {
        const available = availableQuantity();
        const quantityInput = document.getElementById("qty");
        const stockLabel = document.getElementById("selectedStockLabel");
        const addButton = document.getElementById("add");
        const orderButton = document.getElementById("order");
        if (stockLabel) {
          stockLabel.textContent = available > 0
            ? `${available} ${item.type === "trip" ? "kursi" : "stok"} tersedia`
            : "Habis";
          stockLabel.className = available > 0 ? "stock-available" : "stock-empty";
        }
        if (quantityInput) {
          quantityInput.max = Math.max(1, available);
          quantityInput.disabled = available < 1;
          if (Number(quantityInput.value) > available && available > 0)
            quantityInput.value = available;
        }
        if (addButton) addButton.disabled = available < 1;
        if (orderButton) orderButton.disabled = available < 1;
        const unitPriceLabel = document.getElementById("unitPrice");
        if (unitPriceLabel) unitPriceLabel.textContent = rupiah(unitPrice());
        renderPriceTiers();
        updateItemTotal();
      }

      function currentQuantity() {
        const input = document.getElementById("qty");
        const max = availableQuantity();
        const quantity = Math.max(
          1,
          Math.min(max || 1, Number(input?.value || 1)),
        );

        if (input) input.value = quantity;
        return quantity;
      }

      function updateItemTotal() {
        const quantity = currentQuantity();
        document.getElementById("itemSubtotal").textContent = rupiah(
          unitPrice() * quantity,
        );
      }

      async function load() {
        if (!slug) {
          root.innerHTML =
            '<div class="notice error">Item tidak ditemukan.</div>';
          return;
        }

        const { data, error } = await supabase
          .from("items")
          .select(
            "*,item_categories(id,name,slug),item_images(*),item_variants(*),item_price_tiers(*),trip_details(*)",
          )
          .eq("slug", slug)
          .eq("is_active", true)
          .is("archived_at", null)
          .single();

        if (error) {
          root.innerHTML = `<div class="notice error">${esc(error.message)}</div>`;
          return;
        }

        item = data;
        const tripDetail = Array.isArray(item.trip_details)
          ? item.trip_details[0] || {}
          : item.trip_details || {};
        const available = availableQuantity();
        const unitName = item.type === "trip" ? "peserta" : "unit";
        const priceUnit = item.type === "trip" ? "peserta" : "unit / hari";

        const gallery = (item.item_images || []).sort(
          (a, b) => a.sort_order - b.sort_order,
        );
        root.innerHTML = `
        <div class="detail-gallery">
          <img id="detailMainImage" src="${esc(gallery[0]?.image_url || item.image_url)}" alt="${esc(item.title)}">
          ${gallery.length > 1 ? `<div class="detail-thumbnails">${gallery.map((image, index) => `<button type="button" class="detail-thumb ${index === 0 ? "active" : ""}" data-gallery-image="${esc(image.image_url)}"><img src="${esc(image.image_url)}" alt="${esc(image.alt_text || item.title)}"></button>`).join("")}</div>` : ""}
        </div>

        <section>
          <div class="row">
            <span class="badge">${esc(item.item_categories?.name || (item.type === "trip" ? "Open Trip" : "Sewa Item"))}</span>
            <span id="selectedStockLabel" class="${available > 0 ? "stock-available" : "stock-empty"}">
              ${
                available > 0
                  ? `${available} ${item.type === "trip" ? "kursi" : "stok"} tersedia`
                  : "Habis"
              }
            </span>
          </div>

          <h1>${esc(item.title)}</h1>
          ${item.is_featured ? '<span class="catalog-featured-badge">★ Produk unggulan</span>' : ""}
          <p class="muted">${esc(item.description)}</p>

          ${item.location ? `<p><b>Lokasi:</b> ${esc(item.location)}</p>` : ""}

          ${
            item.trip_date
              ? `<p><b>Tanggal:</b> ${new Date(
                  item.trip_date + "T00:00:00",
                ).toLocaleDateString("id-ID", { dateStyle: "long" })}</p>`
              : ""
          }

          ${item.type === "trip" ? `<section class="detail-options trip-public-detail"><h3>Informasi Open Trip</h3><div class="trip-detail-grid"><p><b>Status:</b> ${esc({ draft: "Draft", open: "Pendaftaran dibuka", full: "Penuh", running: "Berjalan", completed: "Selesai", cancelled: "Dibatalkan" }[tripDetail.status] || "Belum diatur")}</p><p><b>Kesulitan:</b> ${esc({ easy: "Mudah", moderate: "Sedang", hard: "Sulit", extreme: "Ekstrem" }[tripDetail.difficulty] || "-")}</p><p><b>Berangkat:</b> ${tripDetail.departure_at ? new Date(tripDetail.departure_at).toLocaleString("id-ID") : "-"}</p><p><b>Pulang:</b> ${tripDetail.return_at ? new Date(tripDetail.return_at).toLocaleString("id-ID") : "-"}</p><p><b>Meeting point:</b> ${esc(tripDetail.meeting_point || "-")}</p><p><b>Batas usia:</b> ${tripDetail.min_age ?? "-"}–${tripDetail.max_age ?? "-"} tahun</p><p><b>Minimal peserta:</b> ${Number(tripDetail.min_participants || 1)}</p><p><b>Batas daftar:</b> ${tripDetail.registration_deadline ? new Date(tripDetail.registration_deadline).toLocaleString("id-ID") : "-"}</p></div>${tripDetail.itinerary ? `<h3>Itinerary</h3><p class="preline">${esc(tripDetail.itinerary)}</p>` : ""}<div class="two">${tripDetail.included_facilities ? `<div><h3>Termasuk</h3><p class="preline">${esc(tripDetail.included_facilities)}</p></div>` : ""}${tripDetail.excluded_facilities ? `<div><h3>Tidak termasuk</h3><p class="preline">${esc(tripDetail.excluded_facilities)}</p></div>` : ""}</div>${tripDetail.required_equipment ? `<h3>Perlengkapan wajib</h3><p class="preline">${esc(tripDetail.required_equipment)}</p>` : ""}</section>` : ""}

          ${
            item.requires_guarantee
              ? `<div class="notice warning">
                <b>Wajib jaminan</b><br>
                ${esc(item.guarantee_note || "Rincian diisi saat checkout.")}
              </div>`
              : ""
          }

          ${Number(item.deposit || 0) > 0 ? `<div class="notice"><b>Deposit barang</b><br>${rupiah(item.deposit)} per unit</div>` : ""}

          ${(item.item_variants || []).length ? `<section class="detail-options"><label class="field"><span>Ukuran / Kapasitas *</span><select id="variantSelect" class="input">${item.item_variants.filter((variant) => variant.is_active !== false).map((variant) => `<option value="${variant.id}" ${Number(variant.stock) < 1 ? "disabled" : ""}>${esc(variant.name)}${variant.capacity ? ` · ${esc(variant.capacity)}` : ""} — ${Number(variant.stock)} unit tersedia</option>`).join("")}</select></label></section>` : ""}

          ${(item.item_price_tiers || []).length ? `<section class="detail-options"><h3>Harga Paket</h3><div id="variantPriceTiers" class="price-tier-list"></div></section>` : ""}

          <div class="detail-order-panel">
            <div class="detail-price-row">
              <div>
                <span class="muted">Harga per ${priceUnit}</span>
                <div id="unitPrice" class="price">${rupiah(item.price)}</div>
              </div>

              <label class="field detail-quantity-field">
                <span>Jumlah ${unitName}</span>
                <input
                  id="qty"
                  class="input"
                  type="number"
                  min="1"
                  max="${Math.max(1, available)}"
                  value="1"
                  ${available < 1 ? "disabled" : ""}
                >
              </label>
            </div>

            <div class="detail-subtotal">
              <span>Subtotal item</span>
              <strong id="itemSubtotal">${rupiah(unitPrice())}</strong>
            </div>

            <div class="actions detail-order-actions">
              <button id="add" class="btn secondary" ${available < 1 ? "disabled" : ""}>
                + Tambah ke Keranjang
              </button>

              <button id="order" class="btn" ${available < 1 ? "disabled" : ""}>
                Pesan Item
              </button>
            </div>

            <p class="muted detail-order-note">
              Pesan Item akan menambahkan pilihan ini ke keranjang yang sudah ada,
              lalu membuka halaman checkout.
            </p>
          </div>

          <div id="msg" class="notice hidden" style="margin-top:14px"></div>
        </section>`;

        document.querySelectorAll("[data-gallery-image]").forEach((button) => {
          button.addEventListener("click", () => {
            document.getElementById("detailMainImage").src =
              button.dataset.galleryImage;
            document
              .querySelectorAll("[data-gallery-image]")
              .forEach((entry) =>
                entry.classList.toggle("active", entry === button),
              );
          });
        });

        const quantityInput = document.getElementById("qty");
        renderPriceTiers();
        quantityInput?.addEventListener("input", updateItemTotal);
        quantityInput?.addEventListener("change", updateItemTotal);
        document.getElementById("variantSelect")?.addEventListener(
          "change",
          updateVariantInterface,
        );
        updateVariantInterface();

        document.getElementById("add")?.addEventListener("click", () => {
          const quantity = currentQuantity();
          addCart(item, quantity, false, selectedVariant());
          message(
            document.getElementById("msg"),
            `${quantity} ${unitName} ditambahkan ke keranjang.`,
            "success",
          );
        });

        document.getElementById("order")?.addEventListener("click", () => {
          const quantity = currentQuantity();

          // Tetap menambah ke keranjang lama, bukan menggantinya.
          addCart(item, quantity, false, selectedVariant());
          location.href = "cart.html";
        });
      }

      load();
    </script>
    <a
      class="customer-service-float"
      href="https://wa.me/6289509349428?text=Halo%20CS%20AbidzarOutdoorcamp%2C%20saya%20ingin%20bertanya%20mengenai%20layanan."
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Hubungi CS AbidzarOutdoorcamp melalui WhatsApp"
      title="Hubungi CS: +62 895-0934-9428"
    >
      <span class="customer-service-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path
            d="M21 11.5a8.5 8.5 0 0 1-12.55 7.47L3 20.5l1.53-5.3A8.5 8.5 0 1 1 21 11.5Z"
          ></path>
          <path
            d="M8.3 7.8c.25-.25.7-.2.88.1l1.05 1.72c.14.24.11.54-.08.74l-.62.64a8.1 8.1 0 0 0 3.47 3.47l.64-.62c.2-.19.5-.22.74-.08l1.72 1.05c.3.18.35.63.1.88l-.75.75c-.65.65-1.62.86-2.48.55a10.7 10.7 0 0 1-5.97-5.97c-.31-.86-.1-1.83.55-2.48l.75-.75Z"
          ></path>
        </svg>
      </span>

      <span class="customer-service-copy">
        <strong>Hubungi CS</strong>
        <small>WhatsApp</small>
      </span>
    </a>
