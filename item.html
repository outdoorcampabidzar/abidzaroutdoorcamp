  <main id="root" class="container detail">Memuat...</main>
<script type="module">
    import { supabase, rupiah, esc, addCart, message } from "./app.js";

    const slug = new URLSearchParams(location.search).get("slug");
    const root = document.getElementById("root");
    let item = null;

    function availableQuantity() {
      return Math.max(0, Number(item.type === "trip" ? item.quota : item.stock) || 0);
    }

    function currentQuantity() {
      const input = document.getElementById("qty");
      const max = availableQuantity();
      const quantity = Math.max(1, Math.min(max || 1, Number(input?.value || 1)));

      if (input) input.value = quantity;
      return quantity;
    }

    function updateItemTotal() {
      const quantity = currentQuantity();
      document.getElementById("itemSubtotal").textContent =
        rupiah(Number(item.price) * quantity);
    }

    async function load() {
      if (!slug) {
        root.innerHTML = '<div class="notice error">Item tidak ditemukan.</div>';
        return;
      }

      const { data, error } = await supabase
        .from("items")
        .select("*")
        .eq("slug", slug)
        .eq("is_active", true)
        .single();

      if (error) {
        root.innerHTML = `<div class="notice error">${esc(error.message)}</div>`;
        return;
      }

      item = data;
      const available = availableQuantity();
      const unitName = item.type === "trip" ? "peserta" : "unit";

      root.innerHTML = `
        <img src="${esc(item.image_url)}" alt="${esc(item.title)}">

        <section>
          <div class="row">
            <span class="badge">${item.type === "trip" ? "Open Trip" : "Sewa Item"}</span>
            <span class="${available > 0 ? "stock-available" : "stock-empty"}">
              ${available > 0
                ? `${available} ${item.type === "trip" ? "kursi" : "stok"} tersedia`
                : "Habis"}
            </span>
          </div>

          <h1>${esc(item.title)}</h1>
          <p class="muted">${esc(item.description)}</p>

          ${item.location
            ? `<p><b>Lokasi:</b> ${esc(item.location)}</p>`
            : ""}

          ${item.trip_date
            ? `<p><b>Tanggal:</b> ${new Date(item.trip_date + "T00:00:00")
                .toLocaleDateString("id-ID", { dateStyle: "long" })}</p>`
            : ""}

          ${item.requires_guarantee
            ? `<div class="notice warning">
                <b>Wajib jaminan</b><br>
                ${esc(item.guarantee_note || "Rincian diisi saat checkout.")}
              </div>`
            : ""}

          <div class="detail-order-panel">
            <div class="detail-price-row">
              <div>
                <span class="muted">Harga per ${unitName}</span>
                <div class="price">${rupiah(item.price)}</div>
              </div>

              <label class="field detail-quantity-field">
                <span>Jumlah ${unitName}</span>
                <input
                  id="qty"
                  class="input"
                  type="number"
                  min="1"
                  max="${Math.max(1, available)}"
                  value="1"
                  ${available < 1 ? "disabled" : ""}
                >
              </label>
            </div>

            <div class="detail-subtotal">
              <span>Subtotal item</span>
              <strong id="itemSubtotal">${rupiah(item.price)}</strong>
            </div>

            <div class="actions detail-order-actions">
              <button id="add" class="btn secondary" ${available < 1 ? "disabled" : ""}>
                + Tambah ke Keranjang
              </button>

              <button id="order" class="btn" ${available < 1 ? "disabled" : ""}>
                Pesan Item
              </button>
            </div>

            <p class="muted detail-order-note">
              Pesan Item akan menambahkan pilihan ini ke keranjang yang sudah ada,
              lalu membuka halaman checkout.
            </p>
          </div>

          <div id="msg" class="notice hidden" style="margin-top:14px"></div>
        </section>`;

      const quantityInput = document.getElementById("qty");
      quantityInput?.addEventListener("input", updateItemTotal);
      quantityInput?.addEventListener("change", updateItemTotal);

      document.getElementById("add")?.addEventListener("click", () => {
        const quantity = currentQuantity();
        addCart(item, quantity);
        message(
          document.getElementById("msg"),
          `${quantity} ${unitName} ditambahkan ke keranjang.`,
          "success"
        );
      });

      document.getElementById("order")?.addEventListener("click", () => {
        const quantity = currentQuantity();

        // Tetap menambah ke keranjang lama, bukan menggantinya.
        addCart(item, quantity);
        location.href = "cart.html";
      });
    }

    load();
  </script>
