<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pembayaran — AbidzarOutdoorcamp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="nav">
      <div class="container nav-inner">
        <a class="brand" href="index.html">Abidzar<span>Outdoorcamp</span></a>
        <a class="btn secondary small" href="orders.html">Pesanan Saya</a>
      </div>
    </nav>
    <main class="container payment-page">
      <section id="paymentCard" class="card payment-card">
        <div class="notice">Memuat pembayaran...</div>
      </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module">
      import { supabase, rupiah, esc, loadSiteSettings } from "./app.js";
      const card = document.getElementById("paymentCard");
      const orderId = new URLSearchParams(location.search).get("order");
      let payment = null;
      let currentOrder = null;
      let settings = null;
      let timer = null;
      let poller = null;
      let checking = false;
      const labels = {
        pending: "Menunggu Pembayaran",
        paid: "Pembayaran Berhasil",
        expired: "Kedaluwarsa",
        cancelled: "Dibatalkan",
        refunded: "Dikembalikan",
        failed: "Gagal",
      };

      async function invoke(action, extra = {}) {
        const { data, error } = await supabase.functions.invoke("btzpay", {
          body: { action, ...extra },
        });
        if (error) throw error;
        if (!data?.success)
          throw new Error(data?.error || "Operasi pembayaran gagal");
        return data;
      }

      async function load() {
        if (!orderId) return showError("Nomor pesanan tidak ditemukan.");
        const {
          data: { user },
        } = await supabase.auth.getUser();
        if (!user)
          return (location.href = `login.html?next=${encodeURIComponent(location.pathname + location.search)}`);
        settings = await loadSiteSettings();
        const { data: order, error } = await supabase
          .from("orders")
          .select("*,order_items(*)")
          .eq("id", orderId)
          .single();
        if (error) return showError(error.message);
        currentOrder = order;
        const { data: rows } = await supabase
          .from("payment_transactions")
          .select("*")
          .eq("order_id", orderId)
          .order("created_at", { ascending: false })
          .limit(1);
        if (!rows?.length) {
          try {
            const created = await invoke("create", { order_id: orderId });
            payment = created.payment;
          } catch (error) {
            return showError(error.message);
          }
        } else payment = rows[0];
        render(order);
      }

      function render(order) {
        clearInterval(timer);
        clearInterval(poller);
        const productModes = new Set((order.order_items || [])
          .filter((line) => line.item_type === "product")
          .map((line) => String(line.fulfillment_type || "rental").toLowerCase()));
        const paymentMode = productModes.has("sale") ? "sale" : "rental";
        const paymentLabels = { qrisorkut: "QRIS Orkut", qrisdana: "QRIS Dana", qrisgopay: "QRIS GoPay", qrisshopeepay: "QRIS ShopeePay" };
        const configuredMethod = paymentMode === "sale"
          ? (settings?.payment_method_sale || settings?.payment_method || "qrisdana")
          : (settings?.payment_method_rental || settings?.payment_method || "qrisorkut");
        const status = payment.status;
        const active = status === "pending";
        card.innerHTML = `
        <div class="payment-heading">
          <div><span class="badge">BTZPay</span><h1>${labels[status] || esc(status)}</h1>
          <p class="muted">Pesanan ${esc(order.order_number)}</p></div>
          <span class="payment-status payment-status-${esc(status)}">${labels[status] || esc(status)}</span>
        </div>
        <div class="payment-amount"><span>Total pembayaran</span><strong>${rupiah(payment.total_amount)}</strong></div>
        <div class="notice">Mode <b>${paymentMode === "sale" ? "Jual" : "Sewa"}</b> · Gateway <b>${esc(paymentLabels[configuredMethod] || configuredMethod)}</b></div>
        ${active ? `<div class="payment-countdown"><span>Selesaikan pembayaran dalam</span><strong id="countdown">--:--</strong></div>` : ""}
        <div class="data-grid payment-data">
          <div class="data"><b>ID Transaksi</b><br>${esc(payment.gateway_transaction_id)}</div>
          <div class="data"><b>Metode</b><br>${esc(payment.payment_method)}</div>
          <div class="data"><b>Dibuat</b><br>${new Date(payment.created_at).toLocaleString("id-ID")}</div>
        </div>
        <div id="paymentMessage" class="notice hidden"></div>
        ${adminOptions().length ? `<div class="payment-admin-invoice"><label class="field"><span>Kirim invoice kepada</span><select id="invoiceAdmin" class="input">${adminOptions().map((admin) => `<option value="${esc(admin.number)}">${esc(admin.name)}</option>`).join("")}</select></label><button id="sendAdminInvoice" class="btn secondary" type="button">Kirim Invoice ke Admin</button></div>` : ""}
        <div class="actions payment-actions">
          <button id="downloadInvoiceBtn" class="btn invoice-print-btn" type="button">Unduh Invoice PDF</button>
          ${active && payment.payment_url ? `<a class="btn" href="${esc(payment.payment_url)}" target="_blank" rel="noopener">Buka Halaman Pembayaran</a>` : ""}
          ${active ? '<button id="checkPayment" class="btn secondary" type="button">Cek Pembayaran</button><button id="cancelPayment" class="btn danger" type="button">Batalkan</button>' : ""}
          ${["expired", "cancelled", "failed"].includes(status) ? '<button id="recreatePayment" class="btn" type="button">Buat Pembayaran Baru</button>' : ""}
          <a class="btn secondary" href="orders.html">Kembali ke Pesanan</a>
        </div>`;
        document
          .getElementById("checkPayment")
          ?.addEventListener("click", check);
        document
          .getElementById("cancelPayment")
          ?.addEventListener("click", cancel);
        document
          .getElementById("recreatePayment")
          ?.addEventListener("click", recreate);
        document
          .getElementById("sendAdminInvoice")
          ?.addEventListener("click", sendInvoiceToAdmin);
        document
          .getElementById("downloadInvoiceBtn")
          ?.addEventListener("click", downloadInvoicePDF);
        if (active) {
          updateCountdown();
          timer = setInterval(() => {
            updateCountdown();
            if (Date.now() >= new Date(payment.expires_at).getTime()) check();
          }, 1000);
          poller = setInterval(check, 8000);
        }
      }

      function adminOptions() {
        return [1, 2, 3]
          .map((index) => ({
            name: String(settings?.[`admin_${index}_name`] || `Admin ${index}`).trim(),
            number: String(settings?.[`admin_${index}_whatsapp`] || "").replace(/\D/g, ""),
          }))
          .filter((admin) => admin.number);
      }

      function sendInvoiceToAdmin() {
        const number = document.getElementById("invoiceAdmin")?.value;
        if (!number || !currentOrder) return showMessage("Nomor WhatsApp admin belum diatur.", "error");
        const items = (currentOrder.order_items || [])
          .map((line) => `- ${line.title_snapshot}${line.variant_name_snapshot ? ` (${line.variant_name_snapshot})` : ""} x${line.quantity}: ${rupiah(line.line_total)}`)
          .join("\n");
        const text = [
          "*INVOICE ABIDZAR OUTDOORCAMP*",
          `Nomor: ${currentOrder.order_number}`,
          `Pelanggan: ${currentOrder.customer_name}`,
          `WhatsApp: ${currentOrder.phone}`,
          currentOrder.rental_start ? `Sewa: ${currentOrder.rental_start} s/d ${currentOrder.rental_end}` : "",
          "",
          items,
          "",
          `Subtotal: ${rupiah(currentOrder.subtotal)}`,
          `Diskon: ${rupiah(currentOrder.discount)}`,
          `Total: ${rupiah(currentOrder.total)}`,
          `Status pembayaran: ${labels[payment.status] || payment.status}`,
          `ID transaksi: ${payment.gateway_transaction_id}`,
          `Tautan: ${location.href}`,
        ].filter(Boolean).join("\n");
        window.open(`https://wa.me/${number}?text=${encodeURIComponent(text)}`, "_blank", "noopener");
      }

      async function downloadInvoicePDF() {
        if (!currentOrder || !payment) {
          showMessage("Invoice belum siap. Silakan tunggu sebentar lalu coba lagi.", "error");
          return;
        }
        const button = document.getElementById("downloadInvoiceBtn");
        const oldText = button?.textContent;
        if (button) {
          button.disabled = true;
          button.textContent = "Membuat PDF...";
        }

        try {
          const JsPDF = window.jspdf?.jsPDF;
          if (!JsPDF) throw new Error("Mesin PDF belum tersedia. Pastikan koneksi internet aktif lalu coba lagi.");

          const order = currentOrder;
          const gateway = payment.payment_method || "-";
          const created = new Date(payment.created_at || order.created_at).toLocaleString("id-ID");
          const status = labels[payment.status] || payment.status || "-";
          const items = order.order_items || [];

          // PDF thermal 80mm: hitung tinggi dari seluruh blok invoice, bukan hanya jumlah item.
          // Ini mencegah bagian tabel/total/footer terpotong pada viewer Android.
          const baseHeight = 116;
          const itemHeights = items.reduce((sum, line) => {
            const title = `${line.title_snapshot || "Item"}${line.variant_name_snapshot ? ` (${line.variant_name_snapshot})` : ""}`;
            const lines = Math.max(1, Math.ceil(title.length / 34));
            return sum + Math.max(7, lines * 3.2 + 4.0);
          }, 0);
          const height = Math.max(140, Math.min(320, baseHeight + itemHeights));
          const doc = new JsPDF({ unit: "mm", format: [80, height], orientation: "portrait", compress: false, precision: 12 });
          const pageW = 80;
          const left = 4;
          const right = 76;
          let y = 4;

          doc.setTextColor(0, 0, 0);
          doc.setDrawColor(0, 0, 0);
          doc.setLineWidth(0.25);
          doc.setFont("helvetica", "normal");

          // Logo hitam-putih dari assets situs.
          try {
            const logoData = await imageToDataURL("assets/abidzar-logo-bw.png");
            doc.addImage(logoData, "PNG", left, y, 15, 15, undefined, "NONE");
          } catch (_) {
            // PDF tetap dibuat walau logo gagal dimuat.
          }
          doc.setFont("helvetica", "bold");
          doc.setFontSize(10);
          doc.text("ABIDZAR OUTDOORCAMP", 21, y + 4.5);
          doc.setFont("helvetica", "bold");
          doc.setFontSize(5.2);
          doc.text("OUTDOOR RENTAL & OPEN TRIP", 21, y + 8);
          doc.setFont("helvetica", "normal");
          doc.setFontSize(4.5);
          const address = doc.splitTextToSize("Jl. Danau Maninjau Barat III No.B2 e30, Sawojajar, Kec. Kedungkandang, Kota Malang, Jawa Timur 65139", 54);
          doc.text(address, 21, y + 10.8, { lineHeightFactor: 1.1 });
          doc.text("Telp / WhatsApp: +62 822-4604-9672", 21, y + 10.8 + address.length * 2.1);
          y += Math.max(17, 11 + address.length * 2.1);
          doc.line(left, y, right, y);
          y += 4;

          doc.setFont("helvetica", "bold");
          doc.setFontSize(12);
          doc.text("INVOICE", left, y);
          doc.setFont("helvetica", "normal");
          doc.setFontSize(4.5);
          doc.text("NO. PESANAN", right, y - 2, { align: "right" });
          doc.text(String(order.order_number || "-"), right, y + 0.5, { align: "right" });
          y += 4;

          const boxW = (right - left - 2) / 2;
          const metaH = 15;
          doc.rect(left, y, boxW, metaH);
          doc.rect(left + boxW + 2, y, boxW, metaH);
          doc.setFontSize(5.3);
          doc.setFont("helvetica", "bold");
          doc.text("Data Pelanggan", left + 1.5, y + 3);
          doc.text("Tanggal", left + boxW + 3.5, y + 3);
          doc.setFont("helvetica", "normal");
          doc.text(doc.splitTextToSize(`${order.customer_name || "-"}\n${order.phone || "-"}`, boxW - 3), left + 1.5, y + 5.5, { lineHeightFactor: 1.15 });
          doc.text(doc.splitTextToSize(`${created}\nStatus: ${status}`, boxW - 3), left + boxW + 3.5, y + 5.5, { lineHeightFactor: 1.15 });
          y += metaH + 1.5;

          const payH = 12;
          doc.rect(left, y, right-left, payH);
          doc.setFont("helvetica", "bold");
          doc.text("Pembayaran", left + 1.5, y + 3);
          doc.setFont("helvetica", "normal");
          doc.text(String(gateway).replace(/^.*?Pembayaran/, "").trim() || String(payment.payment_method || "-"), left + 1.5, y + 5.7);
          doc.setFont("helvetica", "bold");
          doc.text("ID Transaksi", left + 1.5, y + 8.3);
          doc.setFont("helvetica", "normal");
          doc.text(doc.splitTextToSize(String(payment.gateway_transaction_id || "-"), right-left-25), left + 1.5, y + 10.4, { lineHeightFactor: 1.0 });
          y += payH + 1.5;

          if (order.rental_start) {
            doc.rect(left, y, right-left, 8);
            doc.setFont("helvetica", "bold");
            doc.text("Periode sewa", left + 1.5, y + 3);
            doc.setFont("helvetica", "normal");
            doc.text(`${order.rental_start} — ${order.rental_end || order.rental_start}`, left + 1.5, y + 5.8);
            y += 9.5;
          }

          // Tabel item.
          const cols = [left, 48, 54, 65, right];
          const headerH = 6;
          doc.setFillColor(0, 0, 0);
          doc.rect(left, y, right-left, headerH, "F");
          doc.setTextColor(255, 255, 255);
          doc.setFont("helvetica", "bold");
          doc.setFontSize(6.2);
          doc.text("Item", left + 1, y + 4);
          doc.text("Qty", (cols[1]+cols[2])/2, y + 4, { align: "center" });
          doc.text("Harga", cols[3]-1, y + 4, { align: "right" });
          doc.text("Jumlah", right-1, y + 4, { align: "right" });
          doc.setTextColor(0,0,0);
          y += headerH;

          doc.setFont("helvetica", "normal");
          doc.setFontSize(5.7);
          for (const line of items) {
            const title = `${line.title_snapshot || "Item"}${line.variant_name_snapshot ? ` (${line.variant_name_snapshot})` : ""}`;
            const titleLines = doc.splitTextToSize(title, 34);
            const type = line.item_type === "trip" ? "Open Trip" : (line.fulfillment_type === "sale" ? "Jual" : "Sewa");
            const rowH = Math.max(6, titleLines.length * 3.2 + 4.0);
            doc.rect(left, y, right-left, rowH);
            doc.line(cols[1], y, cols[1], y + rowH);
            doc.line(cols[2], y, cols[2], y + rowH);
            doc.line(cols[3], y, cols[3], y + rowH);
            doc.text(titleLines, left + 1, y + 2.8, { lineHeightFactor: 1.0 });
            doc.setFontSize(4.8);
            doc.text(type, left + 1, y + rowH - 1.2);
            doc.setFontSize(4.8);
            doc.text(String(Number(line.quantity || 0)), (cols[1]+cols[2])/2, y + 3.2, { align: "center" });
            doc.text(rupiah(line.unit_price || 0), cols[3]-1, y + 3.2, { align: "right" });
            doc.text(rupiah(line.line_total || 0), right-1, y + 3.2, { align: "right" });
            y += rowH;
          }
          if (!items.length) {
            doc.rect(left, y, right-left, 7);
            doc.text("Tidak ada item.", left + 1, y + 4.2);
            y += 7;
          }

          const totalH = 16;
          doc.rect(left, y, right-left, totalH);
          doc.line(left, y + 5.2, right, y + 5.2);
          doc.line(left, y + 10.4, right, y + 10.4);
          doc.setFontSize(5.8);
          doc.text("Subtotal", left + 1.5, y + 3.5);
          doc.text(rupiah(order.subtotal || 0), right - 1.5, y + 3.5, { align: "right" });
          doc.text("Diskon", left + 1.5, y + 8.7);
          doc.text(`− ${rupiah(order.discount || 0)}`, right - 1.5, y + 8.7, { align: "right" });
          doc.setFont("helvetica", "bold");
          doc.setFontSize(7);
          doc.text("Total", left + 1.5, y + 14);
          doc.text(rupiah(payment.total_amount || order.total || 0), right - 1.5, y + 14, { align: "right" });
          y += totalH + 3;

          doc.line(left, y, right, y);
          y += 3.5;
          doc.setFontSize(5.8);
          doc.text("Terima kasih telah memilih AbidzarOutdoorcamp.", pageW/2, y, { align: "center" });
          doc.setFont("helvetica", "normal");
          doc.setFontSize(5.0);
          doc.text("Simpan invoice ini sebagai bukti pemesanan dan pembayaran.", pageW/2, y + 2.8, { align: "center" });

          const filename = `Invoice-${String(order.order_number || "AbidzarOutdoorcamp").replace(/[^a-zA-Z0-9_-]/g, "-")}.pdf`;
          doc.save(filename);
          showMessage("Invoice PDF berhasil diunduh.", "success");
        } catch (error) {
          console.error(error);
          showMessage(`Gagal membuat PDF: ${error.message || "terjadi kesalahan"}`, "error");
        } finally {
          if (button) {
            button.disabled = false;
            button.textContent = oldText || "Unduh Invoice PDF";
          }
        }
      }

      async function imageToDataURL(src) {
        const response = await fetch(src, { cache: "no-store" });
        if (!response.ok) throw new Error("Logo tidak dapat dimuat");
        const blob = await response.blob();
        return await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      function updateCountdown() {
        const el = document.getElementById("countdown");
        if (!el) return;
        const left = Math.max(
          0,
          new Date(payment.expires_at).getTime() - Date.now(),
        );
        const minutes = Math.floor(left / 60000);
        const seconds = Math.floor((left % 60000) / 1000);
        el.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      async function check() {
        if (checking) return;
        checking = true;
        try {
          const result = await invoke("check", { payment_id: payment.id });
          payment = { ...payment, ...result.payment };
          const { data: order } = await supabase
            .from("orders")
            .select("*")
            .eq("id", orderId)
            .single();
          render(order);
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          checking = false;
        }
      }
      async function cancel() {
        if (!confirm("Batalkan pembayaran dan pesanan ini?")) return;
        try {
          await invoke("cancel", {
            payment_id: payment.id,
            reason: "Dibatalkan pelanggan",
          });
          await load();
        } catch (error) {
          showMessage(error.message, "error");
        }
      }
      async function recreate() {
        try {
          const result = await invoke("recreate", { order_id: orderId });
          payment = result.payment;
          const { data: order } = await supabase
            .from("orders")
            .select("*")
            .eq("id", orderId)
            .single();
          render(order);
        } catch (error) {
          showMessage(error.message, "error");
        }
      }
      function showMessage(text, type) {
        const el = document.getElementById("paymentMessage");
        if (el) {
          el.textContent = text;
          el.className = `notice ${type}`;
        }
      }
      function showError(text) {
        card.innerHTML = `<div class="notice error">${esc(text)}</div><div class="actions" style="margin-top:14px"><a class="btn secondary" href="orders.html">Pesanan Saya</a></div>`;
      }
      load();
    </script>
  </body>
</html>
