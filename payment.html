<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pembayaran — AbidzarOutdoorcamp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="nav">
      <div class="container nav-inner">
        <a class="brand" href="index.html">Abidzar<span>Outdoorcamp</span></a>
        <a class="btn secondary small" href="orders.html">Pesanan Saya</a>
      </div>
    </nav>
    <main class="container payment-page">
      <section id="paymentCard" class="card payment-card">
        <div class="notice">Memuat pembayaran...</div>
      </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module">
      import { supabase, rupiah, esc, loadSiteSettings } from "./app.js";
      const card = document.getElementById("paymentCard");
      const orderId = new URLSearchParams(location.search).get("order");
      let payment = null;
      let currentOrder = null;
      let settings = null;
      let timer = null;
      let poller = null;
      let checking = false;
      const labels = {
        pending: "Menunggu Pembayaran",
        paid: "Pembayaran Berhasil",
        expired: "Kedaluwarsa",
        cancelled: "Dibatalkan",
        refunded: "Dikembalikan",
        failed: "Gagal",
      };

      async function invoke(action, extra = {}) {
        const { data, error } = await supabase.functions.invoke("btzpay", {
          body: { action, ...extra },
        });
        if (error) throw error;
        if (!data?.success)
          throw new Error(data?.error || "Operasi pembayaran gagal");
        return data;
      }

      async function load() {
        if (!orderId) return showError("Nomor pesanan tidak ditemukan.");
        const {
          data: { user },
        } = await supabase.auth.getUser();
        if (!user)
          return (location.href = `login.html?next=${encodeURIComponent(location.pathname + location.search)}`);
        settings = await loadSiteSettings();
        const { data: order, error } = await supabase
          .from("orders")
          .select("*,order_items(*)")
          .eq("id", orderId)
          .single();
        if (error) return showError(error.message);
        currentOrder = order;
        const { data: rows } = await supabase
          .from("payment_transactions")
          .select("*")
          .eq("order_id", orderId)
          .order("created_at", { ascending: false })
          .limit(1);
        if (!rows?.length) {
          try {
            const created = await invoke("create", { order_id: orderId });
            payment = created.payment;
          } catch (error) {
            return showError(error.message);
          }
        } else payment = rows[0];
        render(order);
      }

      function render(order) {
        clearInterval(timer);
        clearInterval(poller);
        const productModes = new Set((order.order_items || [])
          .filter((line) => line.item_type === "product")
          .map((line) => String(line.fulfillment_type || "rental").toLowerCase()));
        const paymentMode = productModes.has("sale") ? "sale" : "rental";
        const paymentLabels = { qrisorkut: "QRIS Orkut", qrisdana: "QRIS Dana", qrisgopay: "QRIS GoPay", qrisshopeepay: "QRIS ShopeePay" };
        const configuredMethod = paymentMode === "sale"
          ? (settings?.payment_method_sale || settings?.payment_method || "qrisdana")
          : (settings?.payment_method_rental || settings?.payment_method || "qrisorkut");
        const status = payment.status;
        const active = status === "pending";
        card.innerHTML = `
        <div class="payment-heading">
          <div><span class="badge">BTZPay</span><h1>${labels[status] || esc(status)}</h1>
          <p class="muted">Pesanan ${esc(order.order_number)}</p></div>
          <span class="payment-status payment-status-${esc(status)}">${labels[status] || esc(status)}</span>
        </div>
        <div class="payment-amount"><span>Total pembayaran</span><strong>${rupiah(payment.total_amount)}</strong></div>
        <div class="notice">Mode <b>${paymentMode === "sale" ? "Jual" : "Sewa"}</b> · Gateway <b>${esc(paymentLabels[configuredMethod] || configuredMethod)}</b></div>
        ${active ? `<div class="payment-countdown"><span>Selesaikan pembayaran dalam</span><strong id="countdown">--:--</strong></div>` : ""}
        <div class="data-grid payment-data">
          <div class="data"><b>ID Transaksi</b><br>${esc(payment.gateway_transaction_id)}</div>
          <div class="data"><b>Metode</b><br>${esc(payment.payment_method)}</div>
          <div class="data"><b>Dibuat</b><br>${new Date(payment.created_at).toLocaleString("id-ID")}</div>
        </div>
        <div id="paymentMessage" class="notice hidden"></div>
        ${adminOptions().length ? `<div class="payment-admin-invoice"><label class="field"><span>Kirim invoice kepada</span><select id="invoiceAdmin" class="input">${adminOptions().map((admin) => `<option value="${esc(admin.number)}">${esc(admin.name)}</option>`).join("")}</select></label><button id="sendAdminInvoice" class="btn secondary" type="button">Kirim Invoice ke Admin</button></div>` : ""}
        <div class="actions payment-actions">
          <button id="downloadInvoiceBtn" class="btn invoice-print-btn" type="button">Unduh Invoice PDF</button>
          ${active && payment.payment_url ? `<a class="btn" href="${esc(payment.payment_url)}" target="_blank" rel="noopener">Buka Halaman Pembayaran</a>` : ""}
          ${active ? '<button id="checkPayment" class="btn secondary" type="button">Cek Pembayaran</button><button id="cancelPayment" class="btn danger" type="button">Batalkan</button>' : ""}
          ${["expired", "cancelled", "failed"].includes(status) ? '<button id="recreatePayment" class="btn" type="button">Buat Pembayaran Baru</button>' : ""}
          <a class="btn secondary" href="orders.html">Kembali ke Pesanan</a>
        </div>`;
        document
          .getElementById("checkPayment")
          ?.addEventListener("click", check);
        document
          .getElementById("cancelPayment")
          ?.addEventListener("click", cancel);
        document
          .getElementById("recreatePayment")
          ?.addEventListener("click", recreate);
        document
          .getElementById("sendAdminInvoice")
          ?.addEventListener("click", sendInvoiceToAdmin);
        document
          .getElementById("downloadInvoiceBtn")
          ?.addEventListener("click", downloadInvoicePDF);
        if (active) {
          updateCountdown();
          timer = setInterval(() => {
            updateCountdown();
            if (Date.now() >= new Date(payment.expires_at).getTime()) check();
          }, 1000);
          poller = setInterval(check, 8000);
        }
      }

      function adminOptions() {
        return [1, 2, 3]
          .map((index) => ({
            name: String(settings?.[`admin_${index}_name`] || `Admin ${index}`).trim(),
            number: String(settings?.[`admin_${index}_whatsapp`] || "").replace(/\D/g, ""),
          }))
          .filter((admin) => admin.number);
      }

      function sendInvoiceToAdmin() {
        const number = document.getElementById("invoiceAdmin")?.value;
        if (!number || !currentOrder) return showMessage("Nomor WhatsApp admin belum diatur.", "error");
        const items = (currentOrder.order_items || [])
          .map((line) => `- ${line.title_snapshot}${line.variant_name_snapshot ? ` (${line.variant_name_snapshot})` : ""} x${line.quantity}: ${rupiah(line.line_total)}`)
          .join("\n");
        const text = [
          "*INVOICE ABIDZAR OUTDOORCAMP*",
          `Nomor: ${currentOrder.order_number}`,
          `Pelanggan: ${currentOrder.customer_name}`,
          `WhatsApp: ${currentOrder.phone}`,
          currentOrder.rental_start ? `Sewa: ${currentOrder.rental_start} s/d ${currentOrder.rental_end}` : "",
          "",
          items,
          "",
          `Subtotal: ${rupiah(currentOrder.subtotal)}`,
          `Diskon: ${rupiah(currentOrder.discount)}`,
          `Total: ${rupiah(currentOrder.total)}`,
          `Status pembayaran: ${labels[payment.status] || payment.status}`,
          `ID transaksi: ${payment.gateway_transaction_id}`,
          `Tautan: ${location.href}`,
        ].filter(Boolean).join("\n");
        window.open(`https://wa.me/${number}?text=${encodeURIComponent(text)}`, "_blank", "noopener");
      }

      async function downloadInvoicePDF() {
        if (!currentOrder || !payment) {
          showMessage("Invoice belum siap. Silakan tunggu sebentar lalu coba lagi.", "error");
          return;
        }
        const button = document.getElementById("downloadInvoiceBtn");
        const oldText = button?.textContent;
        if (button) {
          button.disabled = true;
          button.textContent = "Membuat PDF thermal...";
        }

        try {
          const JsPDF = window.jspdf?.jsPDF;
          if (!JsPDF) throw new Error("Mesin PDF belum tersedia. Pastikan koneksi internet aktif lalu coba lagi.");

          const order = currentOrder;
          const items = order.order_items || [];
          const created = new Date(payment.created_at || order.created_at).toLocaleString("id-ID");
          const status = labels[payment.status] || payment.status || "-";
          const gateway = payment.payment_method || "-";

          /*
           * Thermal PDF v2:
           * - 80mm wide
           * - single dynamic page
           * - 203 DPI canvas (native class of common 80mm thermal printers)
           * - text is rendered large/bold at 2x working resolution, then placed in PDF
           * - no html2canvas and no screenshot of the webpage
           * This avoids the tiny/soft webpage capture that caused the previous result.
           */
          const DPI = 203;
          const MM = DPI / 25.4;
          const W = Math.round(80 * MM); // ~640 px
          const SCALE = 2;
          const CW = W * SCALE;
          const margin = Math.round(3.2 * MM * SCALE);
          const contentW = CW - margin * 2;
          const ctxCanvas = document.createElement("canvas");
          const ctx = ctxCanvas.getContext("2d", { alpha: false });
          if (!ctx) throw new Error("Canvas tidak tersedia di perangkat ini.");

          const font = (size, weight = 400) => `${weight} ${Math.round(size * SCALE)}px Arial, Helvetica, sans-serif`;
          const money = (v) => rupiah(v || 0);
          const wrap = (text, maxWidth, fontSpec) => {
            ctx.font = fontSpec;
            const words = String(text || "-").split(/\s+/);
            const lines = [];
            let line = "";
            for (const word of words) {
              const test = line ? `${line} ${word}` : word;
              if (ctx.measureText(test).width <= maxWidth || !line) line = test;
              else { lines.push(line); line = word; }
            }
            if (line) lines.push(line);
            return lines;
          };

          const itemTitleFont = font(6.5, 700);
          const itemLines = items.map((line) => {
            const title = `${line.title_snapshot || "Item"}${line.variant_name_snapshot ? ` (${line.variant_name_snapshot})` : ""}`;
            return wrap(title, contentW * 0.48, itemTitleFont);
          });

          // Measure page first so it is always exactly ONE page and nothing is clipped.
          let pagePx = Math.round(4 * MM * SCALE);
          const headerH = Math.round(32 * MM * SCALE);
          const invoiceHeadH = Math.round(13 * MM * SCALE);
          const metaH = Math.round(18 * MM * SCALE);
          const paymentH = Math.round(15 * MM * SCALE);
          const periodH = order.rental_start ? Math.round(9.5 * MM * SCALE) : 0;
          const tableHeadH = Math.round(7.5 * MM * SCALE);
          const rowH = (lines) => Math.max(Math.round(11 * MM * SCALE), Math.round((lines.length * 3.8 + 6) * MM * SCALE));
          const tableRowsH = itemLines.reduce((sum, lines) => sum + rowH(lines), 0) || Math.round(10 * MM * SCALE);
          const totalH = Math.round(19 * MM * SCALE);
          const footerH = Math.round(14 * MM * SCALE);
          pagePx += headerH + invoiceHeadH + metaH + paymentH + periodH + tableHeadH + tableRowsH + totalH + footerH;

          ctxCanvas.width = CW;
          ctxCanvas.height = pagePx;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, CW, pagePx);
          ctx.fillStyle = "#000000";
          ctx.strokeStyle = "#000000";
          ctx.textBaseline = "alphabetic";
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";

          const line = (x1, y1, x2, y2, width = 2) => {
            ctx.lineWidth = width * SCALE;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
          };
          const rect = (x, y, w, h, width = 1.5) => {
            ctx.lineWidth = width * SCALE;
            ctx.strokeRect(x, y, w, h);
          };
          const text = (str, x, y, spec, align = "left") => {
            ctx.font = spec; ctx.textAlign = align; ctx.fillText(String(str), x, y);
          };

          let y = Math.round(4 * MM * SCALE);
          // Logo is deliberately large enough for thermal output.
          try {
            const logo = new Image();
            logo.src = await imageToDataURL("assets/abidzar-logo-bw.png");
            await new Promise((resolve, reject) => { logo.onload = resolve; logo.onerror = reject; });
            const logoH = Math.round(19 * MM * SCALE);
            const logoW = Math.round(20 * MM * SCALE);
            ctx.drawImage(logo, margin, y, logoW, logoH);
          } catch (_) {}

          const hx = margin + Math.round(22 * MM * SCALE);
          text("ABIDZAR OUTDOORCAMP", hx, y + Math.round(5 * MM * SCALE), font(10, 800));
          text("OUTDOOR RENTAL & OPEN TRIP", hx, y + Math.round(8.8 * MM * SCALE), font(6.0, 700));
          const address = "Jl. Danau Maninjau Barat III No.B2 e30, Sawojajar, Kec. Kedungkandang, Kota Malang, Jawa Timur 65139";
          const addrLines = wrap(address, contentW - Math.round(22 * MM * SCALE), font(5.3, 400)).slice(0, 3);
          addrLines.forEach((l, i) => text(l, hx, y + Math.round((12 + i * 2.6) * MM * SCALE), font(5.3, 400)));
          text("Telp / WhatsApp: +62 822-4604-9672", hx, y + Math.round((12 + addrLines.length * 2.6) * MM * SCALE), font(5.4, 700));
          y += headerH;

          line(margin, y, CW - margin, y, 2.2); y += Math.round(4.8 * MM * SCALE);
          text("INVOICE", margin, y + Math.round(7 * MM * SCALE), font(12.5, 800));
          text("NO. PESANAN", CW - margin, y + Math.round(3.8 * MM * SCALE), font(5.0, 700), "right");
          text(order.order_number || "-", CW - margin, y + Math.round(7 * MM * SCALE), font(5.5, 700), "right");
          y += invoiceHeadH;

          const gap = Math.round(2 * MM * SCALE);
          const half = Math.floor((contentW - gap) / 2);
          rect(margin, y, half, metaH, 1.5); rect(margin + half + gap, y, half, metaH, 1.5);
          text("Data Pelanggan", margin + Math.round(1.5 * MM * SCALE), y + Math.round(4 * MM * SCALE), font(6.2, 800));
          text(order.customer_name || "-", margin + Math.round(1.5 * MM * SCALE), y + Math.round(7.3 * MM * SCALE), font(6.0, 400));
          text(order.phone || "-", margin + Math.round(1.5 * MM * SCALE), y + Math.round(10.2 * MM * SCALE), font(6.0, 400));
          const rx = margin + half + gap + Math.round(1.5 * MM * SCALE);
          text("Tanggal", rx, y + Math.round(4 * MM * SCALE), font(6.2, 800));
          text(created, rx, y + Math.round(7.3 * MM * SCALE), font(5.8, 400));
          text(`Status: ${status}`, rx, y + Math.round(10.2 * MM * SCALE), font(5.8, 700));
          y += metaH + Math.round(2 * MM * SCALE);

          rect(margin, y, contentW, paymentH, 1.5);
          text("Pembayaran", margin + Math.round(1.5 * MM * SCALE), y + Math.round(4 * MM * SCALE), font(6.2, 800));
          text(gateway, margin + Math.round(1.5 * MM * SCALE), y + Math.round(7.2 * MM * SCALE), font(6.0, 400));
          text("ID Transaksi", margin + Math.round(1.5 * MM * SCALE), y + Math.round(10.3 * MM * SCALE), font(6.0, 800));
          const tx = wrap(payment.gateway_transaction_id || "-", contentW - Math.round(3 * MM * SCALE), font(5.2, 400)).slice(0, 2);
          tx.forEach((l, i) => text(l, margin + Math.round(1.5 * MM * SCALE), y + Math.round((12.7 + i * 2.4) * MM * SCALE), font(5.2, 400)));
          y += paymentH + Math.round(2 * MM * SCALE);

          if (order.rental_start) {
            rect(margin, y, contentW, periodH, 1.5);
            text("Periode sewa", margin + Math.round(1.5 * MM * SCALE), y + Math.round(3.8 * MM * SCALE), font(6.2, 800));
            text(`${order.rental_start} — ${order.rental_end || order.rental_start}`, margin + Math.round(1.5 * MM * SCALE), y + Math.round(6.9 * MM * SCALE), font(5.9, 400));
            y += periodH + Math.round(2 * MM * SCALE);
          }

          // Table with high-contrast header and thick borders.
          const c1 = margin;
          const c2 = margin + Math.round(contentW * 0.64);
          const c3 = margin + Math.round(contentW * 0.73);
          const c4 = margin + Math.round(contentW * 0.88);
          const c5 = CW - margin;
          ctx.fillStyle = "#000000"; ctx.fillRect(margin, y, contentW, tableHeadH); ctx.fillStyle = "#ffffff";
          text("Item", c1 + Math.round(1.2 * MM * SCALE), y + Math.round(5 * MM * SCALE), font(6.2, 800));
          text("Qty", (c2 + c3) / 2, y + Math.round(5 * MM * SCALE), font(6.2, 800), "center");
          text("Harga", c4 - Math.round(1 * MM * SCALE), y + Math.round(5 * MM * SCALE), font(6.0, 800), "right");
          text("Jumlah", c5 - Math.round(1.2 * MM * SCALE), y + Math.round(5 * MM * SCALE), font(6.0, 800), "right");
          ctx.fillStyle = "#000000"; y += tableHeadH;

          items.forEach((lineItem, idx) => {
            const rh = rowH(itemLines[idx]);
            rect(margin, y, contentW, rh, 1.2);
            line(c2, y, c2, y + rh, 1.1); line(c3, y, c3, y + rh, 1.1); line(c4, y, c4, y + rh, 1.1);
            itemLines[idx].forEach((l, j) => text(l, c1 + Math.round(1.2 * MM * SCALE), y + Math.round((3.6 + j * 3.6) * MM * SCALE), itemTitleFont));
            text(lineItem.item_type === "trip" ? "Open Trip" : (lineItem.fulfillment_type === "sale" ? "Jual" : "Sewa"), c1 + Math.round(1.2 * MM * SCALE), y + rh - Math.round(1.5 * MM * SCALE), font(5.2, 400));
            text(String(Number(lineItem.quantity || 0)), (c2 + c3) / 2, y + Math.round(4.2 * MM * SCALE), font(5.8, 700), "center");
            text(money(lineItem.unit_price), c4 - Math.round(1 * MM * SCALE), y + Math.round(4.2 * MM * SCALE), font(5.5, 400), "right");
            text(money(lineItem.line_total), c5 - Math.round(1.2 * MM * SCALE), y + Math.round(4.2 * MM * SCALE), font(5.7, 700), "right");
            y += rh;
          });
          if (!items.length) { rect(margin, y, contentW, Math.round(10 * MM * SCALE), 1.2); text("Tidak ada item.", margin + Math.round(1.2 * MM * SCALE), y + Math.round(6 * MM * SCALE), font(6, 700)); y += Math.round(10 * MM * SCALE); }

          rect(margin, y, contentW, totalH, 1.5);
          line(margin, y + Math.round(6 * MM * SCALE), CW - margin, y + Math.round(6 * MM * SCALE), 1.0);
          line(margin, y + Math.round(12 * MM * SCALE), CW - margin, y + Math.round(12 * MM * SCALE), 1.0);
          text("Subtotal", margin + Math.round(1.5 * MM * SCALE), y + Math.round(4.1 * MM * SCALE), font(6.1, 700));
          text(money(order.subtotal), CW - margin - Math.round(1.5 * MM * SCALE), y + Math.round(4.1 * MM * SCALE), font(6.1, 700), "right");
          text("Diskon", margin + Math.round(1.5 * MM * SCALE), y + Math.round(10 * MM * SCALE), font(6.1, 700));
          text(`− ${money(order.discount)}`, CW - margin - Math.round(1.5 * MM * SCALE), y + Math.round(10 * MM * SCALE), font(6.1, 700), "right");
          text("TOTAL", margin + Math.round(1.5 * MM * SCALE), y + Math.round(16.2 * MM * SCALE), font(7.8, 800));
          text(money(payment.total_amount || order.total), CW - margin - Math.round(1.5 * MM * SCALE), y + Math.round(16.2 * MM * SCALE), font(7.8, 800), "right");
          y += totalH + Math.round(4 * MM * SCALE);

          line(margin, y, CW - margin, y, 1.5); y += Math.round(4.5 * MM * SCALE);
          text("Terima kasih telah memilih AbidzarOutdoorcamp.", CW / 2, y, font(5.9, 700), "center");
          text("Simpan invoice ini sebagai bukti pemesanan dan pembayaran.", CW / 2, y + Math.round(3.2 * MM * SCALE), font(5.2, 400), "center");

          // Convert the high-resolution thermal bitmap into a one-page PDF.
          const imgData = ctxCanvas.toDataURL("image/png");
          const pageH = pagePx / SCALE / MM;
          const doc = new JsPDF({ unit: "mm", format: [80, pageH], orientation: "portrait", compress: true, precision: 12 });
          doc.addImage(imgData, "PNG", 0, 0, 80, pageH, undefined, "FAST");
          const filename = `Invoice-${String(order.order_number || "AbidzarOutdoorcamp").replace(/[^a-zA-Z0-9_-]/g, "-")}-THERMAL.pdf`;
          doc.save(filename);
          showMessage("Invoice PDF thermal berhasil diunduh. Tidak perlu premium.", "success");
        } catch (error) {
          console.error(error);
          showMessage(`Gagal membuat PDF: ${error.message || "terjadi kesalahan"}`, "error");
        } finally {
          if (button) {
            button.disabled = false;
            button.textContent = oldText || "Unduh Invoice PDF";
          }
        }
      }

      async function imageToDataURL(src) {
        const response = await fetch(src, { cache: "no-store" });
        if (!response.ok) throw new Error("Logo tidak dapat dimuat");
        const blob = await response.blob();
        return await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      function updateCountdown() {
        const el = document.getElementById("countdown");
        if (!el) return;
        const left = Math.max(
          0,
          new Date(payment.expires_at).getTime() - Date.now(),
        );
        const minutes = Math.floor(left / 60000);
        const seconds = Math.floor((left % 60000) / 1000);
        el.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      async function check() {
        if (checking) return;
        checking = true;
        try {
          const result = await invoke("check", { payment_id: payment.id });
          payment = { ...payment, ...result.payment };
          const { data: order } = await supabase
            .from("orders")
            .select("*")
            .eq("id", orderId)
            .single();
          render(order);
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          checking = false;
        }
      }
      async function cancel() {
        if (!confirm("Batalkan pembayaran dan pesanan ini?")) return;
        try {
          await invoke("cancel", {
            payment_id: payment.id,
            reason: "Dibatalkan pelanggan",
          });
          await load();
        } catch (error) {
          showMessage(error.message, "error");
        }
      }
      async function recreate() {
        try {
          const result = await invoke("recreate", { order_id: orderId });
          payment = result.payment;
          const { data: order } = await supabase
            .from("orders")
            .select("*")
            .eq("id", orderId)
            .single();
          render(order);
        } catch (error) {
          showMessage(error.message, "error");
        }
      }
      function showMessage(text, type) {
        const el = document.getElementById("paymentMessage");
        if (el) {
          el.textContent = text;
          el.className = `notice ${type}`;
        }
      }
      function showError(text) {
        card.innerHTML = `<div class="notice error">${esc(text)}</div><div class="actions" style="margin-top:14px"><a class="btn secondary" href="orders.html">Pesanan Saya</a></div>`;
      }
      load();
    </script>
  </body>
</html>
