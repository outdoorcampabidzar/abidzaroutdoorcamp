<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pembayaran — AbidzarOutdoorcamp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="nav">
      <div class="container nav-inner">
        <a class="brand" href="index.html">Abidzar<span>Outdoorcamp</span></a>
        <a class="btn secondary small" href="orders.html">Pesanan Saya</a>
      </div>
    </nav>
    <main class="container payment-page">
      <section id="paymentCard" class="card payment-card">
        <div class="notice">Memuat pembayaran...</div>
      </section>
      <section id="printInvoice" class="print-invoice" aria-hidden="true"></section>
    </main>
    <script type="module">
      import { supabase, rupiah, esc, loadSiteSettings } from "./app.js";
      const card = document.getElementById("paymentCard");
      const orderId = new URLSearchParams(location.search).get("order");
      let payment = null;
      let currentOrder = null;
      let settings = null;
      let timer = null;
      let poller = null;
      let checking = false;
      const labels = {
        pending: "Menunggu Pembayaran",
        paid: "Pembayaran Berhasil",
        expired: "Kedaluwarsa",
        cancelled: "Dibatalkan",
        refunded: "Dikembalikan",
        failed: "Gagal",
      };

      async function invoke(action, extra = {}) {
        const { data, error } = await supabase.functions.invoke("btzpay", {
          body: { action, ...extra },
        });
        if (error) throw error;
        if (!data?.success)
          throw new Error(data?.error || "Operasi pembayaran gagal");
        return data;
      }

      async function load() {
        if (!orderId) return showError("Nomor pesanan tidak ditemukan.");
        const {
          data: { user },
        } = await supabase.auth.getUser();
        if (!user)
          return (location.href = `login.html?next=${encodeURIComponent(location.pathname + location.search)}`);
        settings = await loadSiteSettings();
        const { data: order, error } = await supabase
          .from("orders")
          .select("*,order_items(*)")
          .eq("id", orderId)
          .single();
        if (error) return showError(error.message);
        currentOrder = order;
        const { data: rows } = await supabase
          .from("payment_transactions")
          .select("*")
          .eq("order_id", orderId)
          .order("created_at", { ascending: false })
          .limit(1);
        if (!rows?.length) {
          try {
            const created = await invoke("create", { order_id: orderId });
            payment = created.payment;
          } catch (error) {
            return showError(error.message);
          }
        } else payment = rows[0];
        render(order);
      }

      function render(order) {
        clearInterval(timer);
        clearInterval(poller);
        const productModes = new Set((order.order_items || [])
          .filter((line) => line.item_type === "product")
          .map((line) => String(line.fulfillment_type || "rental").toLowerCase()));
        const paymentMode = productModes.has("sale") ? "sale" : "rental";
        const paymentLabels = { qrisorkut: "QRIS Orkut", qrisdana: "QRIS Dana", qrisgopay: "QRIS GoPay", qrisshopeepay: "QRIS ShopeePay" };
        const configuredMethod = paymentMode === "sale"
          ? (settings?.payment_method_sale || settings?.payment_method || "qrisdana")
          : (settings?.payment_method_rental || settings?.payment_method || "qrisorkut");
        const status = payment.status;
        const active = status === "pending";
        card.innerHTML = `
        <div class="payment-heading">
          <div><span class="badge">BTZPay</span><h1>${labels[status] || esc(status)}</h1>
          <p class="muted">Pesanan ${esc(order.order_number)}</p></div>
          <span class="payment-status payment-status-${esc(status)}">${labels[status] || esc(status)}</span>
        </div>
        <div class="payment-amount"><span>Total pembayaran</span><strong>${rupiah(payment.total_amount)}</strong></div>
        <div class="notice">Mode <b>${paymentMode === "sale" ? "Jual" : "Sewa"}</b> · Gateway <b>${esc(paymentLabels[configuredMethod] || configuredMethod)}</b></div>
        ${active ? `<div class="payment-countdown"><span>Selesaikan pembayaran dalam</span><strong id="countdown">--:--</strong></div>` : ""}
        <div class="data-grid payment-data">
          <div class="data"><b>ID Transaksi</b><br>${esc(payment.gateway_transaction_id)}</div>
          <div class="data"><b>Metode</b><br>${esc(payment.payment_method)}</div>
          <div class="data"><b>Dibuat</b><br>${new Date(payment.created_at).toLocaleString("id-ID")}</div>
        </div>
        <div id="paymentMessage" class="notice hidden"></div>
        ${adminOptions().length ? `<div class="payment-admin-invoice"><label class="field"><span>Kirim invoice kepada</span><select id="invoiceAdmin" class="input">${adminOptions().map((admin) => `<option value="${esc(admin.number)}">${esc(admin.name)}</option>`).join("")}</select></label><button id="sendAdminInvoice" class="btn secondary" type="button">Kirim Invoice ke Admin</button></div>` : ""}
        <div class="actions payment-actions">
          <button id="printInvoiceBtn" class="btn invoice-print-btn" type="button">Cetak Invoice</button>
          ${active && payment.payment_url ? `<a class="btn" href="${esc(payment.payment_url)}" target="_blank" rel="noopener">Buka Halaman Pembayaran</a>` : ""}
          ${active ? '<button id="checkPayment" class="btn secondary" type="button">Cek Pembayaran</button><button id="cancelPayment" class="btn danger" type="button">Batalkan</button>' : ""}
          ${["expired", "cancelled", "failed"].includes(status) ? '<button id="recreatePayment" class="btn" type="button">Buat Pembayaran Baru</button>' : ""}
          <a class="btn secondary" href="orders.html">Kembali ke Pesanan</a>
        </div>`;
        renderPrintInvoice(order, payment, paymentMode, paymentLabels[configuredMethod] || configuredMethod);
        document
          .getElementById("checkPayment")
          ?.addEventListener("click", check);
        document
          .getElementById("cancelPayment")
          ?.addEventListener("click", cancel);
        document
          .getElementById("recreatePayment")
          ?.addEventListener("click", recreate);
        document
          .getElementById("sendAdminInvoice")
          ?.addEventListener("click", sendInvoiceToAdmin);
        document
          .getElementById("printInvoiceBtn")
          ?.addEventListener("click", printInvoice);
        if (active) {
          updateCountdown();
          timer = setInterval(() => {
            updateCountdown();
            if (Date.now() >= new Date(payment.expires_at).getTime()) check();
          }, 1000);
          poller = setInterval(check, 8000);
        }
      }

      function adminOptions() {
        return [1, 2, 3]
          .map((index) => ({
            name: String(settings?.[`admin_${index}_name`] || `Admin ${index}`).trim(),
            number: String(settings?.[`admin_${index}_whatsapp`] || "").replace(/\D/g, ""),
          }))
          .filter((admin) => admin.number);
      }

      function sendInvoiceToAdmin() {
        const number = document.getElementById("invoiceAdmin")?.value;
        if (!number || !currentOrder) return showMessage("Nomor WhatsApp admin belum diatur.", "error");
        const items = (currentOrder.order_items || [])
          .map((line) => `- ${line.title_snapshot}${line.variant_name_snapshot ? ` (${line.variant_name_snapshot})` : ""} x${line.quantity}: ${rupiah(line.line_total)}`)
          .join("\n");
        const text = [
          "*INVOICE ABIDZAR OUTDOORCAMP*",
          `Nomor: ${currentOrder.order_number}`,
          `Pelanggan: ${currentOrder.customer_name}`,
          `WhatsApp: ${currentOrder.phone}`,
          currentOrder.rental_start ? `Sewa: ${currentOrder.rental_start} s/d ${currentOrder.rental_end}` : "",
          "",
          items,
          "",
          `Subtotal: ${rupiah(currentOrder.subtotal)}`,
          `Diskon: ${rupiah(currentOrder.discount)}`,
          `Total: ${rupiah(currentOrder.total)}`,
          `Status pembayaran: ${labels[payment.status] || payment.status}`,
          `ID transaksi: ${payment.gateway_transaction_id}`,
          `Tautan: ${location.href}`,
        ].filter(Boolean).join("\n");
        window.open(`https://wa.me/${number}?text=${encodeURIComponent(text)}`, "_blank", "noopener");
      }

      function renderPrintInvoice(order, payment, paymentMode, gatewayLabel) {
        const invoice = document.getElementById("printInvoice");
        if (!invoice) return;
        const items = (order.order_items || []).map((line) => {
          const variant = line.variant_name_snapshot ? ` <small>${esc(line.variant_name_snapshot)}</small>` : "";
          const type = line.item_type === "trip" ? "Open Trip" : (line.fulfillment_type === "sale" ? "Jual" : "Sewa");
          return `<tr>
            <td>${esc(line.title_snapshot || "Item")}${variant}<br><small>${esc(type)}</small></td>
            <td class="qty">${Number(line.quantity || 0)}</td>
            <td class="money">${rupiah(line.unit_price || 0)}</td>
            <td class="money">${rupiah(line.line_total || 0)}</td>
          </tr>`;
        }).join("");
        const rental = order.rental_start
          ? `<div><b>Periode sewa</b><br>${esc(order.rental_start)} — ${esc(order.rental_end || order.rental_start)}</div>`
          : "";
        invoice.innerHTML = `
          <div class="invoice-sheet">
            <header class="invoice-header">
              <img class="invoice-logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABYIAAAUvAQAAAAAklayFAAABCGlDQ1BJQ0MgUHJvZmlsZQAAeJxjYGA8wQAELAYMDLl5JUVB7k4KEZFRCuwPGBiBEAwSk4sLGHADoKpv1yBqL+viUYcLcKakFicD6Q9ArFIEtBxopAiQLZIOYWuA2EkQtg2IXV5SUAJkB4DYRSFBzkB2CpCtkY7ETkJiJxcUgdT3ANk2uTmlyQh3M/Ck5oUGA2kOIJZhKGYIYnBncAL5H6IkfxEDg8VXBgbmCQixpJkMDNtbGRgkbiHEVBYwMPC3MDBsO48QQ4RJQWJRIliIBYiZ0tIYGD4tZ2DgjWRgEL7AwMAVDQsIHG5TALvNnSEfCNMZchhSgSKeDHkMyQx6QJYRgwGDIYMZAKbWPz9HbOBQAAA3K0lEQVR4nO2du27myLqeX0rCSEF7iXA0gBeWGDlyoHCCha0KfCEKHTbgZAxsuGuAFaxwHBpw0JfhzOztHQwMB7oBY7MHE3S0wR50oB5IogMWT8U6fF8dSKrxv4D0k6zTw2KdWVUsOrwufTjbm4CtE3F+nYjz60ScXyfi/DoR59eJOL9OxPl1Is6vE3F+nYjz60ScXyfi/DoR59eJOL9OxPl1IgbwoSiKoigu0vsMID3x56IQ/dHzeJRWiYm7cn72S1rPe6Ul/nrmOk2jtH7+XTvvqqTeAwCKlO+aPpcr718Seg8g8bumr+XqUlfIhAEASBrHnfHuU8fyh3SlZmG+3BVI+5IzWap4thvJVGEASJgqPlZWo8vHRGEACXPe18phJhMFAiBdqnBWb39LFAiAZMSfhcv0uUoTCoBkxA9u409pQgGQKuc9+wrJdAVcopz3xWehShIMgFSp4mefhYTJIgmxv/j6KlKEAyARMaHlnq5xn4KYEoHpIjkFMSmRPiQICEAa4opi6bNMEBKQhNjRapurjg8JQArijtjE/iCigwKQgvh3qsV/jg4KQAriB6rFRN2naOJOkG3K2LAAJCAmJwrgfWxYABIQt3Srv8WGBSCemNNYfxaRgQGIJ/a2M+d6iAwMQDxxy7HMuj2bYokbjuVnGRkaEE1ML9sApKmpI4kZZRuQJiFHEv/Ms868QaPi+tLePrSumyYmOCC6L83O/G1UcABiUwUbIEH5Fkf8nuuA2Pp3KSodO0ZgbYoemY1LxxXfydeY8ADEpYqgRywjAgQQRxyUjX6OCBBAHPFDiKPo0iKGuA5xFF1axBDLDV1NiiAOzPbvw0MEEEUcOFwZO5QcQVyHOXsKDxFADHHo8ENsRySc+I9Qh++DgwQQQxzcQGiDgwQQQ/wQ6vBzcJAAYojrYJcy2CUQ0dpcz7Ah67oNdhrT2vw5PNC4pkVwHFumrJAU04sIjuOoBo2IcRxKHFVzPcQ4DiWOah1EJeRQ4iYm0Kg3IqHEIibQqDcigcSRPYk6wq2f+Lm4Wl+M7K012nlX0AtLP/FvplZaSw7AKD3f/sEY+/ATV+jWkfye6r9Zetn4d+Aj1a23znu+wLqSMk8qZWjpYXcG4K4mufTXeb8BQKldjH5hKxZnvwP0bqOPuH9f97laXo0eJmnmJ/285a+GDG6Sj1iluHZ59YHmuV2L16cqHxK7YT5i5ZvWRRI0z+1alOdV/0OsV4KyUIJxa2G4VpNc+ogb08XYIYelv53hmkMW4rEOEv3PDwvTBDMEZ168GK45ZCb+PBRo6v4v64VxQwaz6slwSHt0ZuJy6KOr+/9+aSzIYFbNssIYtbSXg0biDlB99L7gPW9soYVLjEeD5+e0MRsj8e+Aajq0AIA3S+Mkkw4exqNa/RLzs5H4AVAPqwEAvF0at0Qop8YIHYrhG6JDI7EA1C3XAKCv9GnoXHaNNdxQVFB9NRE/T/8lAHynmdd0LrvGUlglBnKT3kSs/BCDt1pJkWgNzeCLSh5/o               <div class="invoice-business">
                <h1>ABIDZAR OUTDOORCAMP</h1>
                <div class="subtitle">Outdoor Rental & Open Trip</div>
                <p class="contact">Jl. Danau Maninjau Barat III No.B2 e30, Sawojajar, Kec. Kedungkandang, Kota Malang, Jawa Timur 65139</p>
                <p class="contact">Telp / WhatsApp: +62 822-4604-9672</p>
              </div>
            </header>
            <div class="invoice-rule"></div>
            <div class="invoice-titlebar">
              <div class="invoice-title">INVOICE</div>
              <div class="invoice-number">NO. PESANAN<br>${esc(order.order_number || "-")}</div>
            </div>
            <div class="invoice-meta">
              <div><b>Data Pelanggan</b><br>${esc(order.customer_name || "-")}<br>${esc(order.phone || "-")}
              ${order.email ? `<br>${esc(order.email)}` : ""}</div>
              <div><b>Tanggal</b><br>${new Date(payment.created_at || order.created_at).toLocaleString("id-ID")}<br><b>Status</b><br>${esc(labels[payment.status] || payment.status || "-")}</div>
              <div><b>Pembayaran</b><br>${esc(gatewayLabel || payment.payment_method || "-")}<br><b>ID Transaksi</b><br>${esc(payment.gateway_transaction_id || "-")}</div>
            </div>
            ${rental ? `<div class="invoice-period">${rental}</div>` : ""}
            <table class="invoice-table">
              <thead><tr><th>Item</th><th class="qty">Qty</th><th class="money">Harga</th><th class="money">Jumlah</th></tr></thead>
              <tbody>${items || `<tr><td colspan="4">Tidak ada item.</td></tr>`}</tbody>
            </table>
            <div class="invoice-total">
              <div><span>Subtotal</span><b>${rupiah(order.subtotal || 0)}</b></div>
              <div><span>Diskon</span><b>− ${rupiah(order.discount || 0)}</b></div>
              <div class="grand"><span>Total</span><strong>${rupiah(payment.total_amount || order.total || 0)}</strong></div>
            </div>
            <footer class="invoice-footer">
              <b>Terima kasih telah memilih AbidzarOutdoorcamp.</b>
              <span>Simpan invoice ini sebagai bukti pemesanan dan pembayaran.</span>
            </footer>
          </div>`;
      }

      function printInvoice() {
        const invoice = document.getElementById("printInvoice");
        const sheet = invoice?.querySelector(".invoice-sheet");
        if (!sheet || !sheet.textContent.trim()) {
          showMessage("Invoice belum siap. Silakan tunggu sebentar lalu coba lagi.", "error");
          return;
        }

        // Cetak dari dokumen yang sedang aktif. Ini lebih stabil di Android
        // dibanding window.open() + document.write(), yang pada beberapa
        // perangkat menghasilkan Print Preview putih/kosong.
        const body = document.body;
        const previousTitle = document.title;
        const previousScrollY = window.scrollY;
        const orderNumber = currentOrder?.order_number || "invoice";

        body.classList.add("printing-invoice");
        document.title = `Invoice ${orderNumber}`;

        // Paksa browser menghitung ulang layout sebelum snapshot print dibuat.
        void sheet.offsetHeight;

        const restore = () => {
          body.classList.remove("printing-invoice");
          document.title = previousTitle;
          window.scrollTo(0, previousScrollY);
        };

        // afterprint dipanggil Chrome/Android setelah dialog print ditutup.
        window.addEventListener("afterprint", restore, { once: true });

        // Beri satu frame agar display invoice yang sebelumnya hidden benar-
        // benar masuk ke layout sebelum window.print().
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            try {
              window.print();
            } catch (error) {
              restore();
              showMessage("Gagal membuka cetak invoice. Silakan coba lagi.", "error");
            }
          });
        });
      }

      window.addEventListener("afterprint", () => {
        document.body.classList.remove("printing-invoice");
      });

      function updateCountdown() {
        const el = document.getElementById("countdown");
        if (!el) return;
        const left = Math.max(
          0,
          new Date(payment.expires_at).getTime() - Date.now(),
        );
        const minutes = Math.floor(left / 60000);
        const seconds = Math.floor((left % 60000) / 1000);
        el.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      async function check() {
        if (checking) return;
        checking = true;
        try {
          const result = await invoke("check", { payment_id: payment.id });
          payment = { ...payment, ...result.payment };
          const { data: order } = await supabase
            .from("orders")
            .select("*")
            .eq("id", orderId)
            .single();
          render(order);
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          checking = false;
        }
      }
      async function cancel() {
        if (!confirm("Batalkan pembayaran dan pesanan ini?")) return;
        try {
          await invoke("cancel", {
            payment_id: payment.id,
            reason: "Dibatalkan pelanggan",
          });
          await load();
        } catch (error) {
          showMessage(error.message, "error");
        }
      }
      async function recreate() {
        try {
          const result = await invoke("recreate", { order_id: orderId });
          payment = result.payment;
          const { data: order } = await supabase
            .from("orders")
            .select("*")
            .eq("id", orderId)
            .single();
          render(order);
        } catch (error) {
          showMessage(error.message, "error");
        }
      }
      function showMessage(text, type) {
        const el = document.getElementById("paymentMessage");
        if (el) {
          el.textContent = text;
          el.className = `notice ${type}`;
        }
      }
      function showError(text) {
        card.innerHTML = `<div class="notice error">${esc(text)}</div><div class="actions" style="margin-top:14px"><a class="btn secondary" href="orders.html">Pesanan Saya</a></div>`;
      }
      load();
    </script>
