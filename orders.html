    <main class="container orders-page">
      <header class="orders-page-heading">
        <div>
          <h2>Pesanan Saya</h2>
          <p class="muted">Klik satu pesanan untuk melihat rincian item.</p>
        </div>
        <span id="orderCount" class="orders-count hidden"></span>
      </header>

      <div id="orders" class="orders-compact"></div>
      <div id="msg" class="notice hidden"></div>
    </main>
    <script type="module">
      import { supabase, rupiah, esc, message } from "./app.js";

      const labels = {
        pending: "Menunggu",
        confirmed: "Dikonfirmasi",
        paid: "Dibayar",
        completed: "Selesai",
        cancelled: "Dibatalkan",
      };

      function itemSummary(items) {
        const lines = items || [];
        const totalQuantity = lines.reduce(
          (sum, item) => sum + Number(item.quantity || 0),
          0,
        );

        return `${lines.length} jenis · ${totalQuantity} item`;
      }

      function renderOrder(order) {
        const items = order.order_items || [];
        const date = new Date(order.created_at);
        const rentalDate = (value) =>
          new Date(`${String(value).slice(0, 10)}T00:00:00`).toLocaleDateString(
            "id-ID",
            { dateStyle: "long" },
          );

        return `
        <details class="card compact-order">
          <summary class="compact-order-summary">
            <div class="compact-order-identity">
              <span class="order-status order-status-${esc(order.status)}">
                ${labels[order.status] || esc(order.status)}
              </span>

              <div class="compact-order-number">
                <strong>${esc(order.order_number)}</strong>
                <small>${date.toLocaleDateString("id-ID")} · ${date.toLocaleTimeString(
                  "id-ID",
                  {
                    hour: "2-digit",
                    minute: "2-digit",
                  },
                )}</small>
              </div>
            </div>

            <span class="compact-order-item-count">
              ${itemSummary(items)}
            </span>

            <strong class="compact-order-total">
              ${rupiah(order.total)}
            </strong>

            <span class="compact-order-action">
              Lihat detail
            </span>
          </summary>

          <div class="compact-order-details">
            ${
              order.payment_status && order.payment_status !== "unpaid"
                ? `
              <div class="notice compact-payment-status">
                <b>💳 Pembayaran: ${esc({ pending: "Menunggu", paid: "Berhasil", expired: "Kedaluwarsa", cancelled: "Dibatalkan", refunded: "Refund", failed: "Gagal" }[order.payment_status] || order.payment_status)}</b>
                ${
                  ["pending", "expired", "cancelled", "failed"].includes(
                    order.payment_status,
                  )
                    ? `<a class="btn small" href="payment.html?order=${order.id}">${order.payment_status === "pending" ? "Lanjutkan Pembayaran" : "Buat Pembayaran Baru"}</a>`
                    : ""
                }
              </div>
            `
                : ""
            }
            ${
              order.rental_start
                ? `
              <div class="notice compact-rental-period">
                <b>📅 Periode sewa</b>
                <span>${esc(rentalDate(order.rental_start))} — ${esc(rentalDate(order.rental_end))}</span>
                <small>${Number(order.rental_days || 1)} hari</small>
              </div>
            `
                : ""
            }
            <div class="compact-order-lines">
              ${items
                .map(
                  (item) => `
                <div class="compact-order-line">
                  <span>
                    ${esc(item.title_snapshot)}
                    ${item.variant_name_snapshot ? `<small>· ${esc(item.variant_name_snapshot)}</small>` : ""}
                    <small>× ${item.quantity}</small>
                    ${
                      item.item_type === "product" && item.rental_days
                        ? `<small>· ${Number(item.rental_days)} hari</small>`
                        : ""
                    }
                  </span>
                  <b>${rupiah(item.line_total)}</b>
                </div>
              `,
                )
                .join("")}
            </div>

            <div class="compact-order-total-line">
              <span>Total pesanan</span>
              <b>${rupiah(order.total)}</b>
            </div>

            ${
              order.admin_notes
                ? `
              <div class="compact-admin-note">
                <b>Catatan admin</b>
                <span>${esc(order.admin_notes)}</span>
              </div>
            `
                : ""
            }
          </div>
        </details>
      `;
      }

      async function load() {
        const {
          data: { user },
        } = await supabase.auth.getUser();

        if (!user) {
          location.href = "login.html?next=orders.html";
          return;
        }

        const { data, error } = await supabase
          .from("orders")
          .select("*,order_items(*)")
          .order("created_at", { ascending: false });

        if (error) {
          message(document.getElementById("msg"), error.message, "error");
          return;
        }

        const orders = data || [];
        const count = document.getElementById("orderCount");

        if (orders.length) {
          count.textContent = `${orders.length} pesanan`;
          count.classList.remove("hidden");
        }

        document.getElementById("orders").innerHTML =
          orders.map(renderOrder).join("") ||
          '<div class="notice">Belum ada pesanan.</div>';
      }

      load();
    </script>
