<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identitas Akun — AbidzarOutdoorcamp</title><link rel="stylesheet" href="./styles.css"><style>.identity-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:#070b0f}.identity-card{width:min(620px,100%);padding:28px;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:#0d1318}.identity-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.identity-grid .full{grid-column:1/-1}.identity-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.identity-status{min-height:24px;margin-top:12px}.identity-error{color:#ff8c9c}.identity-success{color:#62e5a2}@media(max-width:640px){.identity-grid{grid-template-columns:1fr}}</style></head><body><main class="identity-page"><section class="identity-card"><span class="badge">👤 Langkah 3 dari 3</span><h1>Lengkapi Identitas</h1><p class="muted">Lengkapi identitas sebelum masuk ke Beranda.</p><form id="identityForm" autocomplete="on" novalidate><div class="identity-grid"><label class="field"><span>Nama lengkap *</span><input class="input" name="full_name" autocomplete="name" maxlength="120" required></label><label class="field"><span>Nomor WhatsApp *</span><input class="input" name="phone" autocomplete="tel" inputmode="tel" maxlength="20" required></label><label class="field"><span>Kota/Kabupaten *</span><input class="input" name="city" autocomplete="address-level2" maxlength="100" required></label><label class="field"><span>Kode Pos</span><input class="input" name="postal_code" autocomplete="postal-code" inputmode="numeric" maxlength="10"></label><label class="field full"><span>Alamat domisili *</span><textarea class="input" name="address" autocomplete="street-address" maxlength="500" required></textarea></label></div><div id="identityStatus" class="identity-status" role="status" aria-live="polite"></div><div class="identity-actions"><button id="identitySubmit" class="btn primary" type="submit">Simpan &amp; Lanjut ke Beranda</button><button id="identityLogout" class="btn secondary" type="button">Keluar</button></div></form></section></main><script type="module" src="./identity.js?v=20260928-v33"></script></body></html>
