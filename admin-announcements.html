<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Pengumuman — Admin</title><link rel="stylesheet" href="styles.css"></head><body>
<nav class="nav"><div class="nav-shell"><a class="brand" href="admin.html">Abidzar<span>Outdoorcamp</span></a><a class="btn secondary" href="admin.html">← Admin Panel</a></div></nav>
<main class="container section"><div class="row"><div><span class="badge">📢 CMS</span><h1>Pengumuman Beranda</h1><p class="muted">Kelola informasi yang tampil di halaman utama.</p></div><button class="btn" id="newBtn">+ Pengumuman</button></div>
<div id="msg" class="notice hidden"></div>
<section class="card" style="padding:20px;margin-top:18px"><form id="form" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
<input type="hidden" id="id"><label class="field"><span>Judul *</span><input class="input" id="title" required></label>
<label class="field"><span>Kategori</span><select class="input" id="category"><option value="info">📢 Informasi</option><option value="promo">🔥 Promo</option><option value="warning">⚠️ Peringatan</option><option value="event">🏕️ Event</option><option value="new">🆕 Baru</option></select></label>
<label class="field"><span>Mulai</span><input class="input" type="datetime-local" id="starts"></label>
<label class="field"><span>Berakhir</span><input class="input" type="datetime-local" id="ends"></label>
<label class="field"><span>Urutan</span><input class="input" type="number" id="sort" value="0"></label>
<label class="field"><span>Gambar URL (opsional)</span><input class="input" id="image"></label>
<label class="field"><span>Teks tombol</span><input class="input" id="actionLabel" placeholder="Lihat Selengkapnya"></label>
<label class="field"><span>Link tombol</span><input class="input" id="actionUrl" placeholder="rental.html"></label>
<label class="field" style="grid-column:1/-1"><span>Isi *</span><textarea class="input" id="content" rows="5" required></textarea></label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="active" checked> Aktif</label>
<div style="display:flex;gap:8px;grid-column:1/-1"><button class="btn" type="submit">Simpan</button><button class="btn secondary" type="button" id="cancel">Batal</button></div>
</form></section>
<h2 style="margin-top:28px">Daftar Pengumuman</h2><div id="list"></div></main>
<script type="module">
import {supabase} from "./app.js";
import {listAllAnnouncements,saveAnnouncement,deleteAnnouncement} from "./announcements.js";
const $=id=>document.getElementById(id), msg=$("msg");
const show=(t,bad=false)=>{msg.textContent=t;msg.classList.remove("hidden");msg.style.borderColor=bad?"#ef4444":"";};
const localISO=v=>v?new Date(v).toISOString().slice(0,16):"";
function reset(){ $("form").reset();$("id").value="";$("active").checked=true;$("sort").value=0; }
function fill(a){$("id").value=a.id;$("title").value=a.title;$("category").value=a.category;$("content").value=a.content;$("starts").value=localISO(a.starts_at);$("ends").value=localISO(a.ends_at);$("sort").value=a.sort_order;$("image").value=a.image_url||"";$("actionLabel").value=a.action_label||"";$("actionUrl").value=a.action_url||"";$("active").checked=a.is_active;scrollTo({top:0,behavior:"smooth"});}
async function render(){try{const rows=await listAllAnnouncements();$("list").innerHTML=rows.length?rows.map(a=>`<article class="card" style="padding:16px;margin:10px 0"><div class="row"><div><span class="badge">${a.is_active?"🟢 Aktif":"⚪ Nonaktif"} · ${a.category}</span><h3>${a.title}</h3><p class="muted">${a.content}</p><small>${new Date(a.starts_at).toLocaleString("id-ID")}${a.ends_at?" — "+new Date(a.ends_at).toLocaleString("id-ID"):""}</small></div><div style="display:flex;gap:8px"><button class="btn secondary" data-edit="${a.id}">Edit</button><button class="btn secondary" data-del="${a.id}">Hapus</button></div></div></article>`).join(""):`<div class="notice">Belum ada pengumuman.</div>`;}catch(e){show("Gagal memuat: "+e.message,true)}}
$("form").addEventListener("submit",async e=>{e.preventDefault();try{const payload={title:$("title").value.trim(),content:$("content").value.trim(),category:$("category").value,starts_at:new Date($("starts").value||Date.now()).toISOString(),ends_at:$("ends").value?new Date($("ends").value).toISOString():null,is_active:$("active").checked,sort_order:Number($("sort").value)||0,image_url:$("image").value.trim()||null,action_label:$("actionLabel").value.trim()||null,action_url:$("actionUrl").value.trim()||null};const result=await saveAnnouncement(payload,$("id").value||null);
if(result?.error) throw result.error;
show("Pengumuman tersimpan dan siap tampil di beranda.");reset();render();}catch(e){show("Gagal menyimpan: "+e.message,true)}});
$("list").addEventListener("click",async e=>{const ed=e.target.closest("[data-edit]"),del=e.target.closest("[data-del]");if(ed){const rows=await listAllAnnouncements();fill(rows.find(x=>x.id===ed.dataset.edit));}if(del&&confirm("Hapus pengumuman ini?")){const result=await deleteAnnouncement(del.dataset.del);if(result?.error){show("Gagal menghapus: "+result.error.message,true);return;}render();}});
$("newBtn").onclick=reset;$("cancel").onclick=reset;render();
</script></body></html>
