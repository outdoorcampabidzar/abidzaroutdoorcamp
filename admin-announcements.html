<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Pengumuman — Admin</title><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><div class="nav-shell"><a class="brand" href="admin.html">Abidzar<span>Outdoorcamp</span></a><a class="btn secondary" href="admin.html">← Admin Panel</a></div></nav><main class="container section"><section class="card" style="padding:20px"><div class="admin-list-heading"><div><span class="badge">CMS</span><h1>📢 Pengumuman Beranda</h1><p class="muted">Kelola pengumuman yang tampil di halaman utama.</p></div><button class="btn secondary" id="newBtn" type="button">+ Pengumuman</button></div><div id="msg" class="notice hidden"></div><form id="form" class="form" style="margin-top:16px"><input type="hidden" id="id"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px"><label class="field"><span>Judul *</span><input class="input" id="title" required maxlength="180"></label><label class="field"><span>Kategori</span><select class="input" id="category"><option value="info">📢 Informasi</option><option value="promo">🔥 Promo</option><option value="warning">⚠️ Peringatan</option><option value="event">🏕️ Event</option><option value="new">🆕 Baru</option></select></label><label class="field"><span>Mulai</span><input class="input" type="datetime-local" id="starts"></label><label class="field"><span>Berakhir</span><input class="input" type="datetime-local" id="ends"></label><label class="field"><span>Urutan</span><input class="input" type="number" id="sort" value="0"></label><label class="field"><span>Gambar URL</span><input class="input" id="image"></label><label class="field"><span>Teks tombol</span><input class="input" id="actionLabel"></label><label class="field"><span>Link tombol</span><input class="input" id="actionUrl" placeholder="rental.html"></label><label class="field" style="grid-column:1/-1"><span>Isi *</span><textarea class="input" id="content" rows="5" required maxlength="5000"></textarea></label><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="active" checked> Aktif</label></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" type="submit">Simpan</button><button class="btn secondary" type="button" id="cancel">Batal</button></div></form></section><section style="margin-top:18px"><div id="list"><div class="notice">Memuat pengumuman...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script><script>
(function(){'use strict';var C={SUPABASE_URL:'https://radrtmyrckylvvmdhgqs.supabase.co',SUPABASE_ANON_KEY:'sb_publishable_ad-kaXlIwFlCmV3cR3yDpA_Iq2oWMKk'};var $=function(i){return document.getElementById(i)},msg=$('msg'),rows=[];var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})};var show=function(t,b){msg.textContent=t;msg.className='notice '+(b?'error':'success')};var local=function(v){if(!v)return '';var d=new Date(v);if(isNaN(d.getTime()))return '';return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};var reset=function(){$('form').reset();$('id').value='';$('sort').value='0';$('active').checked=true};var fill=function(a){$('id').value=a.id||'';$('title').value=a.title||'';$('category').value=a.category||'info';$('starts').value=local(a.starts_at);$('ends').value=local(a.ends_at);$('sort').value=Number(a.sort_order||0);$('image').value=a.image_url||'';$('actionLabel').value=a.action_label||'';$('actionUrl').value=a.action_url||'';$('content').value=a.content||'';$('active').checked=a.is_active!==false};function boot(){if(!window.supabase||typeof window.supabase.createClient!=='function')return setTimeout(boot,100);var sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);sb.auth.getSession().then(function(r){if(!r.data.session){location.href='login.html?next=admin-announcements.html';return}load()});async function load(){$('list').innerHTML='<div class="notice">Memuat pengumuman...</div>';var r=await sb.from('site_announcements').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false});if(r.error){$('list').innerHTML='<div class="notice error">'+esc(r.error.message)+'<br><small>Pastikan ANNOUNCEMENTS-SYSTEM.sql sudah dijalankan.</small></div>';return}rows=r.data||[];$('list').innerHTML=rows.length?rows.map(function(a){return '<article class="card" style="padding:16px;margin:10px 0"><div class="row"><div><span class="badge">'+(a.is_active?'🟢 Aktif':'⚪ Nonaktif')+' · '+esc(a.category||'info')+'</span><h3>'+esc(a.title||'Tanpa judul')+'</h3><p class="muted">'+esc(a.content||'')+'</p></div><div style="display:flex;gap:8px"><button class="btn secondary small" data-edit="'+esc(a.id)+'" type="button">Edit</button><button class="btn danger small" data-del="'+esc(a.id)+'" type="button">Hapus</button></div></div></article>'}).join(''):'<div class="notice">Belum ada pengumuman.</div>'} $('form').addEventListener('submit',async function(e){e.preventDefault();var title=$('title').value.trim(),body=$('content').value.trim(),action=$('actionUrl').value.trim();if(!title||!body)return show('Judul dan isi wajib diisi.',true);if(/^javascript:/i.test(action))return show('Link tombol tidak valid.',true);var payload={title:title,content:body,category:$('category').value,starts_at:$('starts').value?new Date($('starts').value).toISOString():new Date().toISOString(),ends_at:$('ends').value?new Date($('ends').value).toISOString():null,is_active:$('active').checked,sort_order:Number($('sort').value)||0,image_url:$('image').value.trim()||null,action_label:$('actionLabel').value.trim()||null,action_url:action||null};var id=$('id').value.trim(),r=id?await sb.from('site_announcements').update(payload).eq('id',id):await sb.from('site_announcements').insert(payload);if(r.error)return show(r.error.message,true);show(id?'Pengumuman diperbarui.':'Pengumuman dibuat.');reset();load()});$('list').addEventListener('click',async function(e){var ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(ed){var a=rows.find(function(x){return String(x.id)===String(ed.dataset.edit)});if(a)fill(a)}if(del){if(!confirm('Hapus pengumuman ini?'))return;var r=await sb.from('site_announcements').delete().eq('id',del.dataset.del);if(r.error)return show(r.error.message,true);show('Pengumuman dihapus.');load()}});$('newBtn').onclick=reset;$('cancel').onclick=reset}boot()})();
</script></body></html>
